<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A1 KID</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6ff;--ink:#2b2d42;--muted:#6b7080;--brand:#6a3fd1;--line:#e3e6f2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:17px}
header{background:linear-gradient(135deg,#6a3fd1,#9b6bff);color:#fff;text-align:center;padding:30px 16px 46px}
header h1{margin:0;font-size:clamp(26px,6vw,38px)}
header p{margin:4px 0 0;opacity:.92}
main{max-width:720px;margin:-26px auto 40px;padding:0 16px}
.unit{display:flex;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px;text-decoration:none;color:inherit;box-shadow:0 4px 18px rgba(30,30,80,.07);transition:transform .15s}
a.unit:hover{transform:translateY(-2px)}
.n{background:var(--brand);color:#fff;font-weight:800;border-radius:12px;padding:8px 12px;flex:none;text-align:center;min-width:92px}
.t{font-weight:800;font-size:18px}
.d{color:var(--muted);font-size:14.5px}
</style>
</head>
<body>
<header>
  <h1>🧒 A1 KID</h1>
  <p>Chọn bài cô giao để làm nhé!</p>
</header>
<main>
  <a class="unit" href="listening-trainer-a1/">
    <span class="n">🎧 Listening</span>
    <span><span class="t">Listening Trainer A1</span><br><span class="d">Bài nghe theo tuần · nối tên, điền từ, viết số</span></span>
  </a>
</main>
</body>
</html>
