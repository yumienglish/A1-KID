<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Listening Trainer A1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f6ff; --card:#fff; --ink:#2b2d42; --muted:#6b7080; --line:#e3e6f2;
  --brand:#6a3fd1; --brand-dark:#4b2a9c; --brand-soft:#efe9ff; --accent:#ff8c42; --blue:#3a6df0;
  --ok:#1f8a4c; --ok-bg:#e7f7ee; --bad:#d64045; --bad-bg:#fdecec; --wait:#b7791f; --wait-bg:#fff6e0;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.6}
.hero{position:relative;background:linear-gradient(135deg,#6a3fd1,#9b6bff);color:#fff;padding:22px 16px 44px;text-align:center}
.hero h1{margin:0;font-size:clamp(25px,5.5vw,36px);font-weight:800;letter-spacing:.2px}
.hero p{margin:4px 0 0;opacity:.93;font-size:15.5px}
/* nút về trang chủ: to, rõ */
.home{display:inline-flex;align-items:center;gap:6px;background:#fff;color:var(--brand-dark);font-weight:800;font-size:18px;text-decoration:none;border-radius:999px;padding:10px 22px;box-shadow:0 4px 0 rgba(0,0,0,.2);margin-bottom:12px}
.home:hover{background:#fff7d6}
.home:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
@media (min-width:900px){.home{position:absolute;left:clamp(12px,3vw,48px);top:20px;margin:0}}
/* tràn màn hình: dùng hết bề ngang */
main{max-width:none;margin:-26px auto 0;padding:0 clamp(12px,3vw,48px) 130px}
.card{background:var(--card);border-radius:18px;box-shadow:0 4px 18px rgba(30,30,80,.07);padding:20px;margin-bottom:18px;border:1px solid var(--line)}
@media (max-width:520px){.card{padding:16px 14px}}
h2,h3{line-height:1.3}

/* start */
.start h2{margin:0 0 4px;font-size:21px}
.field{display:flex;flex-direction:column;gap:4px;margin:12px 0}
.field label{font-weight:700;font-size:15px}
.field input{font:inherit;padding:10px 12px;border:2px solid #d9dcec;border-radius:12px;outline:none;background:#fcfcff}
.field input:focus{border-color:var(--brand)}
.btn{font:inherit;font-weight:800;border:none;border-radius:14px;padding:12px 22px;cursor:pointer;background:var(--brand);color:#fff;box-shadow:0 3px 0 var(--brand-dark)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--brand-dark)}
.btn.orange{background:var(--accent);box-shadow:0 3px 0 #c9661f}
.btn:disabled{opacity:.6;cursor:default}
.err-msg{color:var(--bad);font-weight:700;font-size:14.5px;min-height:1em}
.who{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:15.5px}
.whoname{display:flex;align-items:center;gap:10px;min-width:0;flex-wrap:wrap}

/* avatar */
.av{display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:999px;background:var(--brand-soft);font-size:28px;line-height:1;overflow:hidden;flex:none;border:3px solid #fff;box-shadow:0 2px 8px rgba(30,30,80,.18)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.avbtn{position:relative;background:none;border:none;padding:0;cursor:pointer;flex:none}
.avbtn .avedit{position:absolute;right:-4px;bottom:-2px;background:#fff;border-radius:999px;width:20px;height:20px;font-size:11px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.avbox{margin:6px 0 4px}
.avbox.under{flex-basis:100%}
.avpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.avopt{position:relative;aspect-ratio:1;border-radius:999px;border:3px solid transparent;background:var(--brand-soft);font-size:28px;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:0;overflow:hidden;transition:transform .12s}
.avopt:hover{transform:scale(1.08)}
.avopt.on{border-color:var(--accent);box-shadow:0 0 0 3px #ffd9bd;transform:scale(1.08)}
.avopt.photo{background:#fff5df;border-style:dashed;border-color:#e0b25c}
.avopt.photo.on{border-style:solid;border-color:var(--accent)}
.avopt.photo small{font-size:9.5px;font-weight:800;color:#b7791f;margin-top:2px}
.avopt.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.avopt.photo.on small{display:none}
.who b{color:var(--brand)}
.linkbtn{background:none;border:none;color:var(--blue);font:inherit;font-size:14.5px;cursor:pointer;text-decoration:underline;padding:0}
.closed{text-align:center;color:var(--muted)}

/* exercise head */
.ex-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:2px}
.badge{background:var(--brand);color:#fff;font-weight:800;border-radius:10px;padding:3px 10px;font-size:16px;flex:none}
.ex-head h2{font-size:19px;margin:2px 0 0}
.src{color:var(--muted);font-size:13.5px;font-weight:700;margin:0 0 10px}
.how{color:var(--muted);font-size:14.5px;margin:4px 0 14px;background:#f4f5fb;border-radius:10px;padding:8px 12px}
.how b{color:var(--ink)}

/* audio */
/* thanh audio dính ở đầu màn hình khi lướt trong bài (--stick = dưới thanh "Lần 1" nếu có) */
.listen{background:#eef3ff;border-radius:14px;padding:10px 12px;margin-bottom:12px;position:sticky;top:var(--stick,8px);z-index:30;border:1px solid #dbe5ff;box-shadow:0 4px 14px rgba(30,40,110,.16)}
.listen .lt{font-weight:800;font-size:15px;color:var(--blue)}
.player{display:block;width:100%;height:40px;margin:6px 0 2px}

/* picture + markers */
/* hình luôn vừa màn hình: khung co theo ảnh, ảnh cao tối đa 72% màn hình */
.pic{position:relative;width:fit-content;max-width:100%;margin:4px auto 14px;border-radius:12px;overflow:hidden;border:1px solid var(--line);user-select:none;-webkit-user-select:none}
.pic img{display:block;width:auto;max-width:100%;height:auto;max-height:min(72vh, calc(100vh - 210px))}
.pic.small{max-width:640px;margin-left:auto;margin-right:auto}
.mk{position:absolute;transform:translate(-50%,-50%);font:inherit;font-weight:800;font-size:15px;line-height:1.2;border-radius:999px;padding:3px 10px;min-width:30px;text-align:center;
  background:var(--brand);color:#fff;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);white-space:nowrap}
.mk.example{background:#0fb5c9}
button.mk{cursor:pointer;background:#fff;color:var(--brand);border:2.5px dashed var(--brand)}
button.mk.on{background:var(--brand);color:#fff;border-style:solid}
button.mk.ok{background:var(--ok);color:#fff;border:2px solid #fff}
button.mk.bad{background:var(--bad);color:#fff;border:2px solid #fff}
button.mk:disabled{cursor:default}
button.mk .fx{display:block;font-size:12px;font-weight:700;opacity:.95}
@media (max-width:520px){.mk{font-size:12.5px;padding:2px 7px;min-width:24px}}

/* name chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
.chip{font:inherit;font-weight:800;font-size:16px;border-radius:999px;padding:5px 14px;border:2px solid #d9dcec;background:#fff;color:var(--ink);cursor:pointer}
.chip.sel{border-color:var(--accent);background:#fff1e6;color:#c9661f;box-shadow:0 0 0 3px #ffd9bd}
.chip.used{background:var(--brand-soft);border-color:var(--brand-soft);color:var(--brand)}
.chip.example{background:#e0f8fb;border-color:#e0f8fb;color:#0b8a99;cursor:default}
.chip:disabled{cursor:default}
.tip{font-size:14px;color:var(--muted);margin:-4px 0 8px;min-height:1.2em}
.tip b{color:#c9661f}

/* blanks */
.cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(150px,100%),1fr));gap:10px 14px}
@media (max-width:520px){.cells{gap:8px 10px}}
.cell{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cell .cn{font-weight:800;color:var(--brand);min-width:24px;text-align:right}
.cell .cn.mk2{background:var(--brand);color:#fff;border-radius:999px;min-width:28px;text-align:center;padding:0 6px}
.cell.ex0 .cn{color:#0b8a99}
.cell.ex0 .exv{font-weight:800;color:#0b8a99;border-bottom:2.5px solid #9fdde5;padding:2px 8px;flex:1}
input.txt{font:inherit;font-weight:700;color:var(--blue);border:none;border-bottom:2.5px solid #b3b8cc;background:#f2f4fa;border-radius:8px 8px 3px 3px;padding:4px 8px;outline:none;min-width:0;margin:2px}
.cell input.txt{flex:1}
input.txt:focus{border-color:var(--brand);background:#f3efff}
input.txt.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
input.txt.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
input.txt:disabled{opacity:1;-webkit-text-fill-color:currentColor}
.fix{font-size:14px;font-weight:800;color:var(--ok)}
.fix:empty{display:none}
.cell .fix{flex-basis:100%;padding-left:30px;line-height:1.3}
.fix.hint{color:var(--wait);font-weight:700}

/* numbers bank */
.bank{display:flex;flex-wrap:wrap;gap:6px 14px;font-weight:800;font-size:22px;color:#0fb5c9;margin:0 0 12px;letter-spacing:.5px}

/* sentence table / form */
.tbl{border:2px solid #b8e05a;border-radius:12px;overflow:hidden}
.tbl .tt{background:#b8e05a;text-align:center;font-weight:800;padding:6px}
.tbl.form{border-color:#cfd3e3}
.tbl.form .tt{background:#f4f5fb;font-size:19px}
.row{display:grid;grid-template-columns:34px 1fr minmax(160px,1.05fr);border-top:1px solid #e9ecd9;align-items:center}
.row:first-of-type{border-top:none}
.row .rn{font-weight:800;color:var(--brand);text-align:center;align-self:stretch;display:flex;align-items:center;justify-content:center;background:#f1f9dd}
.tbl.form .row .rn{background:#f7f8fc}
.row .rq{padding:8px 10px}
.row .ra{padding:6px 10px;background:#fffbea;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.tbl.form .row .ra{background:#fff}
.row>*{min-width:0}
.row .ra input.txt{flex:1 1 90px;min-width:0}
.row .ra .exv{font-weight:800;color:#0b8a99;border-bottom:2.5px solid #9fdde5;padding:2px 8px;flex:1}
.row .ra .fix{flex-basis:100%}
.row.ex0 .rn{color:#0b8a99}
@media (max-width:560px){
  .row{grid-template-columns:30px 1fr}
  .row .rq{padding-bottom:2px}
  .row .ra{grid-column:2;background:transparent;padding-top:0}
}

/* feedback */
.fb{display:none;margin-top:10px;border-radius:12px;padding:10px 12px;font-size:15px;line-height:1.55}
.fb.show{display:block}
.fb.ok{background:var(--ok-bg);border-left:4px solid var(--ok)}
.fb.bad{background:var(--bad-bg);border-left:4px solid var(--bad)}

/* summary */
.summary{display:flex;gap:18px;align-items:center;flex-wrap:wrap;border:2px solid var(--brand)}
.score{font-size:46px;font-weight:800;color:var(--brand);line-height:1}
.score span{font-size:24px;color:var(--muted)}
.secs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.sec{background:#eceef6;border-radius:999px;padding:2px 10px;font-weight:700;font-size:14px}
.sec.full{background:var(--ok-bg);color:var(--ok)}
.meme{width:170px;max-width:42vw;height:auto;border-radius:14px;box-shadow:0 3px 10px rgba(0,0,0,.18);flex:none}
.status{font-weight:700;font-size:15px;margin-top:4px}
.status.ok{color:var(--ok)} .status.err,.status.warn{color:var(--bad)} .status.sending{color:var(--muted)}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:40;backdrop-filter:blur(6px)}
.bar-in{max-width:none;margin:0 auto;display:flex;align-items:center;gap:14px}
.prog{flex:1;min-width:0}
.prog .t{font-size:14px;font-weight:700;color:var(--muted)}
.prog .track{height:10px;background:#e4e6f0;border-radius:99px;overflow:hidden;margin-top:3px}
.prog .fill{height:100%;background:linear-gradient(90deg,#9b6bff,#6a3fd1);width:0;transition:width .3s}
/* sau lần 1: thanh ghim đầu màn hình + chế độ chỉ hiện câu sai */
.topbar{position:sticky;top:8px;z-index:45;display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;background:#fff4e6;border:2px solid var(--accent);border-radius:16px;padding:10px 14px;margin-bottom:16px;box-shadow:0 6px 18px rgba(0,0,0,.14)}
.topbar .tt{flex:1;min-width:160px;font-weight:800;font-size:16.5px;line-height:1.35}
.topbar .btn{padding:11px 18px}
.rt-hide{display:none!important}
body.retrying #summaryBox,body.retrying #whoBar,body.retrying .src,body.retrying .how,body.retrying .words{display:none}

/* nhiệm vụ + từ mới */
.words h2{margin:0 0 6px;font-size:20px}
.mission{margin:0 0 14px;padding-left:22px}
.mission li{margin:2px 0}
.note{background:#fff7d6;border:2px dashed #f0c419;border-radius:14px;padding:8px 14px;font-size:16px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(230px,100%),1fr));gap:4px 16px;margin-top:8px}
.vi{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;border-bottom:1px solid var(--line);padding:4px 0}
.vipa{font-size:13.5px;color:var(--muted)} .vmean{font-size:14.5px;flex-basis:100%}
.aw{margin:14px 0 0;font-size:17px;color:var(--ok)}
/* từ highlight: chạm xem nghĩa + máy đọc */
.vw{font:inherit;font-weight:800;color:#5a4300;background:#fff1a6;border:none;border-bottom:2px solid #f0c419;border-radius:6px;padding:0 4px;margin:0 1px;cursor:pointer;line-height:1.35}
.vw:hover{background:#ffe46b}
.pop{position:absolute;z-index:60;background:#fff;border:2px solid #f0c419;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:10px 14px}
.pop .pw{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:20px}
.pop .say{font-size:20px;background:var(--brand-soft);border:none;border-radius:10px;padding:2px 8px;cursor:pointer}
.pop .pi{color:var(--muted);font-size:14.5px}
.pop .pv{font-weight:700;font-size:16.5px;color:var(--brand-dark)}
.how .vn{display:block;margin-top:2px}

/* bài nối tên: tranh bên trái, khung tên bên phải dính theo khi cuộn */
.dz{display:flex;justify-content:center;align-items:flex-start;gap:18px}
.dz-work{min-width:0;flex:0 1 auto}
.dz .pic{margin-top:0}
.dz-side{flex:0 0 190px;position:sticky;top:calc(var(--stick,8px) + var(--lh,84px) + 8px);z-index:5}
.namebox{background:#fff7ec;border:2px solid #ffd2a8;border-radius:16px;padding:10px;box-shadow:0 6px 18px rgba(201,102,31,.15)}
.namebox .nh{font-weight:800;font-size:14.5px;color:#c9661f;margin-bottom:8px;line-height:1.3}
.dz-side .chips{flex-direction:column;align-items:stretch;margin:0}
.dz-side .tip{margin:8px 0 0;font-size:13.5px;line-height:1.35}
.dz-side .tip:empty{display:none}
/* điện thoại: khung tên thành dải ngang dính ngay dưới thanh audio, tranh giữ đủ to */
@media (max-width:700px){
  .dz{flex-direction:column;align-items:stretch;gap:8px}
  .dz-side{order:-1;flex:none;top:calc(var(--stick,8px) + var(--lh,84px) + 4px)}
  .namebox{padding:6px 8px}
  .namebox .nh{display:none}
  .dz-side .chips{flex-direction:row;gap:6px}
  .dz-side .chip{font-size:15px;padding:3px 11px}
  .dz-side .tip{font-size:13px;margin-top:4px}
}
[hidden]{display:none!important}

/* hộp xác nhận trên trang (thay confirm của trình duyệt) */
.modal{position:fixed;inset:0;background:rgba(20,20,50,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.mbox{background:#fff;border-radius:20px;padding:22px 20px;max-width:430px;width:100%;text-align:center;box-shadow:0 14px 40px rgba(0,0,0,.3)}
.mmsg{font-size:18px;font-weight:700;line-height:1.5;margin-bottom:18px}
.mbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.mbtns .btn{min-width:140px}
.btn.dim{opacity:.5}
.btn.ghost{background:#fff;color:var(--brand);border:2px solid var(--brand);box-shadow:none}
.okmsg{color:var(--ok);font-weight:800;font-size:15.5px;background:var(--ok-bg);border-radius:12px;padding:8px 12px;margin:10px 0 0}
</style>
</head>
<body>
<header class="hero">
  <a class="home" href="../">⬅️ Home</a>
  <h1>🎧 Listening Trainer A1</h1>
  <p id="weekSub">A1 Movers</p>
</header>

<main>
  <!-- Màn hình nhập tên -->
  <section class="card start" id="start">
    <h2>👋 Hello!</h2>
    <div class="okmsg" id="redoMsg" hidden>✅ Cô đã cho em làm lại bài. Bấm <b>Start</b> để bắt đầu nhé!</div>
    <p style="margin:0;color:var(--muted)">Write your name and class, choose an avatar, then press <b>Start</b>. Put on your headphones 🎧</p>
    <div class="field"><label for="inName">Your full name</label><input id="inName" autocomplete="name" placeholder="e.g. Nguyễn Minh Anh"></div>
    <div class="field"><label for="inCls">Your class</label><input id="inCls" placeholder="e.g. Movers 1"></div>
    <div class="field"><label>Choose your avatar</label><div id="avStart" class="avbox"></div></div>
    <div class="err-msg" id="startErr"></div>
    <button class="btn" id="startBtn" type="button">Start ▶</button>
  </section>

  <div id="work" hidden>
    <div class="topbar" id="topbar" hidden></div>
    <div id="summaryBox"></div>
    <div class="card who" id="whoBar"></div>
    <div id="exList"></div>
  </div>
</main>

<div class="bar" id="bar" hidden>
  <div class="bar-in">
    <div class="prog"><div class="t" id="progT">Done 0/0</div><div class="track"><div class="fill" id="progF"></div></div></div>
    <button class="btn orange" id="submitBtn" type="button">Submit ✔</button>
  </div>
</div>
<div class="pop" id="pop" hidden></div>
<div class="modal" id="modal" hidden><div class="mbox" role="dialog" aria-modal="true">
  <div class="mmsg" id="mMsg"></div>
  <div class="mbtns"><button class="btn ghost" type="button" id="mYes"></button><button class="btn" type="button" id="mNo"></button></div>
</div></div>

<script>
/* ============ CẤU HÌNH ============ */
// Tuần đang mở cho học sinh. Mỗi tuần đổi số này (và thêm bài của tuần đó vào WEEKS bên dưới).
const OPEN_WEEK = 1;
// URL Web App của Google Apps Script (dùng chung với các trang BTVN khác)
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyAom9bBpL0ms0VD7_bz5w691011llkFzttYSjKDyRyMCjLLeUZ4EZGGJLtLMFWuiV4sA/exec';
const UNIT = 'Listening Trainer A1';
// Chống nộp nhầm: còn trống quá tỉ lệ này thì không cho nộp lần 1; làm chưa đủ số phút này thì chưa cho nộp.
const MAX_EMPTY = 0.25;
const MIN_MINUTES = 3;
// Link cho em làm lại (xoá bài đã nộp của tuần đang mở, trên đúng máy em đã làm):
//   https://yumienglish.github.io/A1-KID/listening-trainer-a1/?lamlai=yumi-lamlai
// Mỗi link chỉ dùng được 1 lần trên mỗi máy. Cần cho em đó làm lại lần nữa thì thêm số: ?lamlai=yumi-lamlai2, yumi-lamlai3…
const RESET_CODE = 'yumi-lamlai';

/* ============ BÀI TẬP TỪNG TUẦN ============
   Đáp án: nhiều cách viết đúng thì ngăn bằng dấu |   VD: 'funfair|fun fair'
   Khi chấm: không phân biệt hoa/thường, bỏ qua dấu chấm, dấu nháy, gạch nối và khoảng trắng.
   Toạ độ x, y của nhãn trên tranh tính theo % chiều ngang / chiều dọc của tranh.
   Từ highlight (chạm xem nghĩa + máy đọc): {{khoá}} hoặc {{khoá|chữ hiển thị}}; khoá phải có trong VOCAB.

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const squash = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]/g, '');
const alts = k => String(k || '').split('|').map(x => x.trim()).filter(Boolean);

let VOICE = null;
function pickVoice(){
  try {
    const vs = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
    VOICE = vs.find(v => /^en[-_]GB/i.test(v.lang) && /female|libby|sonia|serena|kate|hazel|google uk english female/i.test(v.name)) ||
      vs.find(v => /^en[-_]GB/i.test(v.lang)) || vs.find(v => /^en[-_]US/i.test(v.lang)) || vs[0] || null;
  } catch (e) {}
}
if ('speechSynthesis' in window){ pickVoice(); try { speechSynthesis.onvoiceschanged = pickVoice; } catch (e) {} }
function say(text){
  try {
    if (!('speechSynthesis' in window) || !text) return;
    speechSynthesis.cancel(); try { speechSynthesis.resume(); } catch (e) {}
    const u = new SpeechSynthesisUtterance(text);
    u.lang = VOICE ? VOICE.lang : 'en-GB'; if (VOICE) u.voice = VOICE; u.rate = .85;
    speechSynthesis.speak(u);
  } catch (e) {}
}

function lev(a, b){
  const d = Array.from({length:a.length + 1}, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}
// Gợi ý cho câu sai (không lộ đáp án)
function hintFor(i){
  const e = WEEK.ex.find(x => x.id === i.sec);
  if (e.type === 'picTag') return 'Listen again. Look at their clothes and what they are doing.';
  if (!i.ans) return 'You didn’t answer this.';
  const y = squash(i.ans);
  const near = alts(i.keyRaw).some(a => { const x = squash(a); return x.length >= 4 && lev(x, y) <= Math.max(1, Math.floor(x.length / 4)); });
  if (near) return 'Almost! Check your spelling.';
  if (e.type === 'picWrite') return 'Listen again to the spelling of the name.';
  if (e.type === 'list' && e.numeric) return 'Careful: fifteen = 15, fifty = 50.';
  if (e.type === 'list') return 'Listen again and write every letter.';
  return 'Listen again to this part.';
}
function snap(R){
  const ok = {}, ans = {}, hint = {};
  R.items.forEach(i => { ok[i.key] = i.ok; ans[i.key] = i.ans; if (i.ok === false) hint[i.key] = hintFor(i); });
  return {score:R.score, total:R.total, ok, ans, hint, tag:Object.assign({}, S.tag),
    sections:R.sections.map(s => ({id:s.id, title:s.title, score:s.score, total:s.total, pending:false})),
    items:R.items.map(i => ({sec:i.sec, n:i.n, q:i.q, ans:i.ans, correct:i.correct, ok:i.ok}))};
}

  } else if (e.type === 'list'){
    body = (e.bank ? `<div class="bank">${e.bank.map(n => `<span>${n}</span>`).join('')}</div>` : '') +
      `<div class="cells">${e.example ? `<div class="cell ex0"><span class="cn">0.</span><span class="exv">${esc(e.example)}</span></div>` : ''}
      ${e.items.map((_, j) => `<label class="cell"><span class="cn">${j + 1}.</span>${inp(e.id + '-' + (j + 1), 'Question ' + (j + 1), e.numeric ? 'inputmode="numeric" maxlength="3"' : '')}<span class="fix" id="fix-${e.id}-${j + 1}"></span></label>`).join('')}</div>`;
  } else if (e.type === 'table'){
    const row = (n, r, isEx) => {
      const [q, pre, key, post] = r, k = e.id + '-' + n;
      const ans = isEx ? `<span class="exv">${esc(key)}</span>` : inp(k, 'Question ' + n);
      return `<div class="row${isEx ? ' ex0' : ''}"><span class="rn">${isEx ? (e.form ? '' : '0') : n}</span><span class="rq">${vt(q)}</span>
        <span class="ra">${pre ? `<span>${vt(pre)}</span>` : ''}${ans}${post ? `<span>${vt(post)}</span>` : ''}${isEx ? '' : `<span class="fix" id="fix-${k}"></span>`}</span></div>`;
    };
    body = `<div class="pic small"><img src="img/${e.img}" alt="" loading="lazy"></div>
      <div class="tbl${e.form ? ' form' : ''}"><div class="tt">${vt(e.head)}</div>
        ${row(0, e.example, true)}${e.rows.map((r, j) => row(j + 1, r, false)).join('')}</div>`;
  }
  return `<section class="card ex" id="ex${e.id}">
    <div class="ex-head"><span class="badge">Exercise ${i + 1}</span><h2>${vt(e.title)}</h2></div>
    <div class="listen"><div class="lt">🎧 Listen</div><audio class="player" controls preload="none" src="audio/${e.track}.mp3"></audio></div>
    <p class="how">${vt(e.how)}</p>
    ${body}
  </section>`;
}

function renderTags(e){

/* ============ TIẾN ĐỘ ============ */
function answeredList(){
  const a = [];
  document.querySelectorAll('input.txt').forEach(el => a.push(!!(S.t[el.dataset.k] || '').trim()));

    for (let i = 0; i < need; i++) a.push(i < n);
  });

}

    $('#progF').style.width = (RES.total ? RES.score / RES.total * 100 : 100) + '%';
  } else if (fixing()){
    topProgress();

}

/* ============ CHẤM ĐIỂM ============ */
function grade(){
  const items = [];
  const text = (sec, k, n, q, key) => {
    const ans = (S.t[k] || '').trim();
    items.push({sec, key:k, n:String(n), q, ans, correct:firstAlt(key), keyRaw:key, ok:check(ans, key)});
  };
  WEEK.ex.forEach(e => {
    if (e.type === 'picWrite') e.marks.forEach(m => text(e.id, e.id + '-' + m.k, m.k, 'Tên người ' + m.k + ' trong tranh', m.key));
    else if (e.type === 'list') e.items.forEach((key, j) => text(e.id, e.id + '-' + (j + 1), j + 1, (e.numeric ? 'Số câu ' : 'Từ câu ') + (j + 1), key));
    else if (e.type === 'table') e.rows.forEach((r, j) => text(e.id, e.id + '-' + (j + 1), j + 1, unv([r[0], r[1], '_____', r[3]].filter(Boolean).join(' ')), r[2]));
    else if (e.type === 'picTag') e.marks.filter(m => m.key).forEach(m => {
      const where = Object.keys(S.tag).find(x => x.startsWith(e.id + '-') && S.tag[x] === m.key);
      const ans = S.tag[e.id + '-' + m.k] || '';
      items.push({sec:e.id, key:tagKey(e, m.key), n:m.key, q:'Nối tên ' + m.key, ans:ans ? 'gắn ' + ans : (where ? 'gắn nhầm chỗ' : '(chưa nối)'), correct:m.key, ok:ans === m.key});
    });
  });
  const sections = WEEK.ex.map((e, i) => {
    const its = items.filter(x => x.sec === e.id);
    return {id:e.id, title:`Bài ${i + 1} · Track ${e.track} · ${unv(e.title)}`, score:its.filter(x => x.ok).length, total:its.length, pending:false};
  });
  return {items, sections, score:items.filter(x => x.ok).length, total:items.length};
}

/* ============ HIỂN THỊ KẾT QUẢ ============ */
// Sau lần 1: câu đúng xanh, câu sai đỏ (khoá hết). Khi bấm "Làm lại": câu sai mở ra + 💡 gợi ý. Chưa hiện đáp án.
function paintFixInput(el){
  const k = el.dataset.k, ok = r1ok(k), fix = $('#fix-' + k);
  el.classList.remove('ok', 'bad');
  if (ok === true){ el.classList.add('ok'); el.disabled = true; if (fix){ fix.className = 'fix'; fix.textContent = ''; } return; }
  el.disabled = !retrying();
  if ((S.t[k] || '').trim() === S.r1.ans[k]) el.classList.add('bad');
  if (fix){ fix.className = 'fix hint'; fix.textContent = retrying() ? '💡 ' + (S.r1.hint[k] || '') : ''; }
}
function showFix(){
  document.querySelectorAll('input.txt').forEach(paintFixInput);
  WEEK.ex.filter(e => e.type === 'picTag').forEach(e => {
    renderTags(e);
    const wrong = S.r1.items.filter(i => i.sec === e.id && i.ok === false).length, fb = $('#fb-' + e.id);
    fb.className = 'fb show ' + (wrong ? 'bad' : 'ok');
    fb.innerHTML = !wrong ? '<b>✅ All correct!</b>'
      : retrying() ? `<b>Fix ${wrong} name${wrong > 1 ? 's' : ''}.</b> Red = wrong place.<br>💡 ${esc(hintFor({sec:e.id}))}`
      : `<b>❌ ${wrong} wrong.</b>`;
  });
  $('#bar').hidden = true; // nút ở thanh ghim đầu màn hình
  focusWrong(retrying());
  renderTop(); renderWho(); renderSummary(); progress();
}
function showFinal(){
  focusWrong(false); renderTop();
  if (WEEK) $('#bar').hidden = false;
  RES = grade();
  RES.items.forEach(i => {
    if (!i.key || i.key.includes(':')) return;
    const el = document.querySelector(`input.txt[data-k="${i.key}"]`), fix = $('#fix-' + i.key);
    if (el){ el.disabled = true; el.classList.remove('ok', 'bad'); el.classList.add(i.ok ? 'ok' : 'bad'); }
    if (fix){ fix.className = 'fix'; fix.textContent = i.ok ? '' : '→ ' + i.correct; }
  });
  WEEK.ex.filter(e => e.type === 'picTag').forEach(e => {
    renderTags(e);
    const s = RES.sections.find(x => x.id === e.id), fb = $('#fb-' + e.id);
    fb.className = 'fb show ' + (s.score === s.total ? 'ok' : 'bad');
    fb.innerHTML = s.score === s.total ? '<b>✅ All correct!</b>' : `<b>${s.score}/${s.total}</b> · Red boxes show the answer (→).`;
  });
  document.querySelectorAll('input.txt').forEach(el => el.disabled = true);
  $('#submitBtn').hidden = true;
  paintAfterWords(); renderWho(); renderSummary(); progress();
}
function render(){ if (S.done) showFinal(); else if (fixing()) showFix(); }

// GIF meme sau mỗi lần nộp, theo điểm của lần đó: img/meme/<mức>-<số>.gif (bộ ảnh giống KET/PET).
// MEMES = số ảnh mỗi mức (thêm ảnh thì tăng số). Ưu tiên ảnh em chưa gặp; giữ cố định khi mở lại trang.
const MEMES = {wow:7, good:8, ok:8, oops:6};
const SEEN_KEY = 'a1kid-memes-seen';
function memeOf(R, field){
  const pct = R.total ? R.score / R.total : 1;
  const tier = pct === 1 ? 'wow' : pct >= .8 ? 'good' : pct >= .5 ? 'ok' : 'oops';
  if (!S[field] || !S[field].startsWith(tier + '-')){
    const all = Array.from({length:MEMES[tier]}, (_, i) => tier + '-' + (i + 1));
    let seen = []; try { seen = JSON.parse(localStorage.getItem(SEEN_KEY)) || []; } catch (e) {}
    if (!Array.isArray(seen)) seen = [];
    let pool = all.filter(m => !seen.includes(m));
    if (!pool.length){ seen = seen.filter(m => !m.startsWith(tier + '-')); pool = all; }
    S[field] = pool[Math.floor(Math.random() * pool.length)];
    seen.push(S[field]); try { localStorage.setItem(SEEN_KEY, JSON.stringify(seen)); } catch (e) {}
    save();
  }
  return `<img class="meme" src="img/meme/${S[field]}.gif" alt="">`;
}

function renderSummary(){
  let html;
  if (fixing()){
    const r = S.r1;
    html = `<div class="card summary">${memeOf(r, 'meme')}
      <div class="score">${r.score}<span>/${r.total}</span></div>
      <div style="flex:1;min-width:220px">
        <div class="secs">${r.sections.map((s, i) => `<span class="sec${s.score === s.total ? ' full' : ''}">Ex ${i + 1}: ${s.score}/${s.total}</span>`).join('')}</div>
        <div style="font-size:14.5px;color:var(--muted)">Red = wrong.</div>
        <div class="status" id="sendStatus"></div>
      </div></div>`;
  } else {
    const pct = RES.total ? RES.score / RES.total : 0, two = S.r1 && S.submittedAt2;
    html = `<div class="card summary">${two ? memeOf(RES, 'meme2') : memeOf(S.r1 || RES, 'meme')}
      <div class="score">${RES.score}<span>/${RES.total}</span></div>
      <div style="flex:1;min-width:220px">
        <div style="font-weight:800;font-size:18px">${RES.score === RES.total ? '🎉 All correct! Amazing!' : pct >= .8 ? '👏 Great job!' : pct >= .5 ? '💪 Good work!' : '📚 Keep trying!'}</div>
        ${two ? `<div style="font-weight:700">Try 1: ${S.r1.score}/${S.r1.total} → Try 2: ${RES.score}/${RES.total}</div>` : ''}
        <div class="secs">${RES.sections.map((s, i) => `<span class="sec${s.score === s.total ? ' full' : ''}">Ex ${i + 1}: ${s.score}/${s.total}</span>`).join('')}</div>
        <div style="font-size:14.5px;color:var(--muted)">Wrong answers show the right answer (→).</div>
        <div class="status" id="sendStatus"></div>
      </div></div>`;
  }
  $('#summaryBox').innerHTML = html;
  updateStatus();
}

/* ============ GỬI BÀI ============ */
let sendState = null, sendErr = '', sending = false;
function updateStatus(){
  const el = $('#sendStatus'); if (!el) return;
  const allSent = S.sent && (!S.submittedAt2 || S.sent2);
  const st = allSent ? 'ok' : sendState;
  el.className = 'status ' + (st || '');
  if (st === 'ok') el.innerHTML = fixing() ? '✅ Your teacher got Try 1.' : S.submittedAt2 ? '✅ Your teacher got Try 2!' : '✅ Your teacher got your work!';
  else if (st === 'sending') el.innerHTML = '⏳ Sending to your teacher…';
  else if (st === 'warn') el.innerHTML = '⚠️ Trang chưa được cài địa chỉ gửi bài (SCRIPT_URL), nên bài chưa được gửi cho cô.';
  else if (st === 'err') el.innerHTML = `⚠️ Chưa gửi được bài${sendErr ? ` (${esc(sendErr)})` : ''}. Em kiểm tra mạng rồi bấm: <button class="btn" type="button" id="resendBtn" style="padding:6px 14px;font-size:14px;margin-left:4px">Gửi lại</button>`;
  else el.innerHTML = '';
  const rb = $('#resendBtn'); if (rb) rb.onclick = send;
}
function base(){ return {app:'btvn', unit:UNIT, title:TITLE + (S.redo ? ' – LÀM LẠI' + (S.redo > 1 ? ' lần ' + S.redo : '') : ''), redo:S.redo || 0, name:S.name, cls:S.cls, sid:S.sid || '', wantsAudio:false, audio:null}; }
function payload1(){
  const r = S.r1 || snap(grade());
  return Object.assign(base(), {attempt:1, canRetry:!!S.r1 && r.items.some(i => i.ok === false),
    submittedAt:S.submittedAt, startedAt:S.startedAt || null, leaves:S.leaves || 0, timeTakenSec:durSec(S.startedAt, S.submittedAt),
    score:r.score, total:r.total, sections:r.sections, items:r.items});
}
function payload2(){
  const R = grade(), r = S.r1;
  return Object.assign(base(), {attempt:2,
    submittedAt:S.submittedAt2, startedAt:S.retryAt || S.submittedAt, leaves:S.leaves2 || 0, timeTakenSec:durSec(S.retryAt || S.submittedAt, S.submittedAt2),
    score:R.score, total:R.total,
    sections:R.sections.map(s => ({id:s.id, title:s.title, score:s.score, total:s.total, pending:false})),
    items:R.items.map(i => ({sec:i.sec, n:i.n, q:i.q, ans:i.ans, correct:i.correct, ok:i.ok})),
    first:{score:r.score, total:r.total, sections:r.sections, items:r.items,
      startedAt:S.startedAt || null, submittedAt:S.submittedAt, timeTakenSec:durSec(S.startedAt, S.submittedAt), leaves:S.leaves || 0}});
}
async function post(p){
  const r = await fetch(SCRIPT_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(p)});
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'máy chủ báo lỗi');
}
async function send(){
  if (!SCRIPT_URL || SCRIPT_URL.includes('PASTE_')){ sendState = 'warn'; updateStatus(); return; }
  if (sending) return; // đang gửi: vòng lặp bên dưới sẽ tự gửi tiếp lần 2
  sending = true; sendState = 'sending'; updateStatus();
  try {
    for (;;){
      if (!S.sent){ await post(payload1()); S.sent = true; save(); continue; }
      if (S.submittedAt2 && !S.sent2){ await post(payload2()); S.sent2 = true; save(); continue; }
      break;
    }
    sendState = 'ok';
  } catch (err){
    sendState = 'err'; sendErr = err && err.message ? err.message : String(err);
  }
  sending = false; updateStatus();
}

/* ============ NỘP BÀI ============ */
$('#submitBtn').addEventListener('click', async () => {
  if (S.submitted || !WEEK || !$('#modal').hidden) return;
  const a = answeredList(), done = a.filter(Boolean).length, left = a.length - done;
  if (left > a.length * MAX_EMPTY){
    await modal(`📝 Em mới làm <b>${done}/${a.length}</b> câu.<br>Em làm tiếp rồi mới nộp bài nhé! 💪`, '', 'OK, em làm tiếp');
    return;
  }
  const mins = S.startedAt ? (Date.now() - new Date(S.startedAt)) / 60000 : MIN_MINUTES;
  if (mins < MIN_MINUTES){
    await modal(`🎧 Em làm nhanh quá!<br>Nghe lại và kiểm tra bài thêm <b>${Math.ceil(MIN_MINUTES - mins)} phút</b> nữa rồi mới nộp được nhé.`, '', 'OK, em kiểm tra lại');
    return;
  }
  const go = await modal(left ? `Em còn <b>${left} câu</b> chưa làm.<br>Em chắc chắn muốn nộp bài cho cô?` : 'Em đã kiểm tra kĩ chưa?<br>Nộp bài cho cô nhé?', 'Nộp bài', 'Làm tiếp ✏️');
  if (!go || S.submitted) return;
  document.querySelectorAll('audio').forEach(x => x.pause());
  Object.keys(selName).forEach(k => selName[k] = null);
  S.submitted = true; S.submittedAt = new Date().toISOString(); S.sid = makeSid();
  S.r1 = snap(grade());
  if (!S.r1.items.some(i => i.ok === false)) S.done = true; // đúng hết thì không cần lần 2
  save();
  render();
  window.scrollTo({top:0, behavior:'smooth'});
  send();
});
async function submit2(){
  if (!retrying() || !$('#modal').hidden) return;
  const w = wrongKeys().length, c = changedCount();
  if (!c){ await modal('✏️ Em chưa sửa câu nào.<br>Sửa các câu sai rồi mới nộp lần 2 nhé!', '', 'OK, em sửa bài'); return; }
  const go = await modal(`Em đã sửa <b>${c}/${w}</b> câu sai.<br>Nộp lần 2 cho cô nhé? Nộp xong sẽ hiện đáp án, không sửa được nữa.`, 'Nộp lần 2', 'Sửa tiếp ✏️');
  if (!go || !retrying()) return;
  document.querySelectorAll('audio').forEach(x => x.pause());
  Object.keys(selName).forEach(k => selName[k] = null);
  S.done = true; S.submittedAt2 = new Date().toISOString();
  save();
  render();
  window.scrollTo({top:0, behavior:'smooth'});
  send();
}

/* ============ AVATAR: hình có sẵn hoặc ảnh trong máy (chỉ lưu trên máy em, không gửi đi) ============ */
// Dùng chung cho các trang A1 KID (cùng địa chỉ yumienglish.github.io).
const AV_KEY = 'a1kid-avatar';
const AVATARS = ['🦊', '🐼', '🐯', '🐨', '🦄', '🐸', '🐱', '🐶', '🐵', '🦁', '🐰', '🐧', '🐙', '🦖', '🐝', '🐳', '🦋', '🐲', '👾', '🤖', '🐻', '🦉', '🐬', '🦒'];
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } };
const avGet = () => { const a = lsGet(AV_KEY); return a && (a.e || (typeof a.img === 'string' && a.img.startsWith('data:image/'))) ? a : null; };
function avHTML(){
  const a = avGet();
  return `<span class="av">${a && a.img ? `<img src="${esc(a.img)}" alt="">` : a ? a.e : '🙂'}</span>`;
}
function avPicker(){
  const a = avGet() || {};
  return `<div class="avpick">
      <label class="avopt photo${a.img ? ' on' : ''}" title="Photo from your device">${a.img ? `<img src="${esc(a.img)}" alt="">` : '📷'}<small>Photo</small><input type="file" accept="image/*" hidden data-avfile></label>
      ${AVATARS.map(e => `<button type="button" class="avopt${a.e === e ? ' on' : ''}" data-av="${e}">${e}</button>`).join('')}
    </div>`;
}
// thu ảnh về hình vuông 200px (cắt giữa) cho nhẹ, lưu được trong máy
function shrinkImg(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const w = im.naturalWidth, h = im.naturalHeight, s = Math.min(w, h);
      URL.revokeObjectURL(url); if (!s) return rej(new Error('empty'));
      const c = document.createElement('canvas'); c.width = c.height = 200;
      c.getContext('2d').drawImage(im, (w - s) / 2, (h - s) / 2, s, s, 0, 0, 200, 200);
      res(c.toDataURL('image/jpeg', .85));
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('bad image')); };
    im.src = url;
  });
}
// gắn sự kiện cho 1 ô chọn avatar; onChange chạy sau khi đã lưu
function bindAvPicker(box, onChange){
  box.innerHTML = avPicker();
  box.onclick = ev => {
    const b = ev.target.closest('[data-av]'); if (!b) return;
    lsSet(AV_KEY, {e:b.dataset.av}); box.innerHTML = avPicker(); onChange();
  };
  box.onchange = async ev => {
    const f = ev.target.closest('[data-avfile]'); if (!f || !f.files || !f.files[0]) return;
    muteAway = true;
    try {
      if (!lsSet(AV_KEY, {img:await shrinkImg(f.files[0])}) || !avGet()) throw new Error('not saved');
      box.innerHTML = avPicker(); onChange();
    } catch (e){ alert('This photo can’t be opened. Please choose another one.'); }
    releaseAway();
  };
}
// chọn ảnh trong máy sẽ mở cửa sổ khác → không tính là rời trang
document.addEventListener('click', ev => { if (ev.target.closest('.avopt.photo')) muteAway = true; }, true);

/* ============ TÊN HỌC SINH ============ */
function renderWho(){
  const t = d => new Date(d).toLocaleString('vi-VN');
  $('#whoBar').innerHTML = `<span class="whoname"><button type="button" class="avbtn" id="avBtn" title="Change avatar">${avHTML()}<span class="avedit">✏️</span></button>
      <span><b>${esc(S.name)}</b> · Class <b>${esc(S.cls)}</b></span></span>` +
    (S.submitted ? `<span style="color:var(--muted);font-size:14px">${S.r1 ? 'Try 1' : 'Submitted'}: ${t(S.submittedAt)}${S.submittedAt2 ? ` · Try 2: ${t(S.submittedAt2)}` : ''}</span>` : `<button class="linkbtn" type="button" id="editName">Edit name / class</button>`) +
    `<div class="avbox under" id="avBox" hidden></div>`;
  const b = $('#editName'); if (b) b.onclick = () => { $('#work').hidden = true; $('#bar').hidden = true; $('#start').hidden = false; bindAvPicker($('#avStart'), () => {}); $('#inName').focus(); };
  $('#avBtn').onclick = () => {
    const box = $('#avBox'); box.hidden = !box.hidden;
    if (!box.hidden) bindAvPicker(box, () => { $('#avBtn .av').outerHTML = avHTML(); });
  };
}
function showWork(){
  $('#start').hidden = true; $('#work').hidden = false; $('#bar').hidden = !WEEK || fixing();
  renderWho(); progress(); setStick();
}
$('#inName').value = S.name; $('#inCls').value = S.cls;
bindAvPicker($('#avStart'), () => { if ($('#startErr').textContent.includes('avatar')) $('#startErr').textContent = ''; });
$('#startBtn').addEventListener('click', () => {
  const n = $('#inName').value.trim(), c = $('#inCls').value.trim();
  if (n.length < 2){ $('#startErr').textContent = 'Please write your full name.'; return; }
  if (!c){ $('#startErr').textContent = 'Please write your class.'; return; }
  if (!avGet()){ $('#startErr').textContent = 'Please choose an avatar.'; $('#avStart').scrollIntoView({behavior:'smooth', block:'center'}); return; }
  $('#startErr').textContent = '';
  S.name = n.slice(0, 80); S.cls = c.slice(0, 30);
  if (!S.startedAt) S.startedAt = new Date().toISOString();
  save();
  showWork(); window.scrollTo({top:0});
});
['inName', 'inCls'].forEach(id => $('#' + id).addEventListener('keydown', e => { if (e.key === 'Enter') $('#startBtn').click(); }));

/* ============ ĐẾM SỐ LẦN RỜI TRANG ============ */
// Đếm riêng cho lần 1 (leaves) và lúc làm lại câu sai (leaves2)
let away = false, muteAway = false;
function releaseAway(){ setTimeout(() => { muteAway = false; away = false; }, 800); }
const tracking = () => !!S.startedAt && !S.done && (!S.submitted || !!S.retrying) && !$('#work').hidden;
function goAway(){
  if (muteAway || away || !tracking()) return;
  away = true;
  if (S.submitted) S.leaves2 = (S.leaves2 || 0) + 1; else S.leaves = (S.leaves || 0) + 1;
  save();
}
function comeBack(){ if (!document.hidden && document.hasFocus()) away = false; }
document.addEventListener('visibilitychange', () => document.hidden ? goAway() : comeBack());
window.addEventListener('blur', goAway);
window.addEventListener('focus', comeBack);

/* ============ KHỞI ĐỘNG ============ */
build();
if (justReset) $('#redoMsg').hidden = false; // vừa mở link làm lại → về màn hình Start
else if (S.name) showWork();
if (S.submitted && WEEK) render();
if (S.submitted && WEEK && (!S.sent || (S.submittedAt2 && !S.sent2))) send(); // lần trước gửi chưa xong → gửi tiếp
</script>
</body>
