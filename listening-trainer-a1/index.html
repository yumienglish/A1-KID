<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Listening Trainer A1 🎧</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --card:#fff; --ink:#2b2d42; --muted:#6b7080; --line:#e3e6f2;
  --brand:#6a3fd1; --brand-dark:#4b2a9c; --brand-soft:#efe9ff; --accent:#ff8a3d; --blue:#2f6fe4;
  --ok:#1f8a4c; --ok-bg:#e7f7ee; --bad:#d64045; --bad-bg:#fdecec; --wait:#b7791f; --wait-bg:#fff6e0;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
/* nền kiểu game, màu tươi sáng */
body{margin:0;color:var(--ink);font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:18px;line-height:1.6;background:
  radial-gradient(circle at 8% 12%,rgba(255,214,102,.35) 0 90px,transparent 91px),
  radial-gradient(circle at 92% 30%,rgba(140,220,255,.35) 0 120px,transparent 121px),
  radial-gradient(circle at 15% 70%,rgba(180,240,190,.35) 0 110px,transparent 111px),
  radial-gradient(circle at 88% 85%,rgba(255,170,200,.3) 0 100px,transparent 101px),
  linear-gradient(180deg,#e3f9ff 0%,#effff3 50%,#fff7e3 100%) fixed}
[hidden]{display:none!important}
h2,h3{line-height:1.3}
.hero{position:relative;overflow:hidden;color:#fff;text-align:center;padding:22px 16px 74px;
  background:url(img/ui/hero.webp) center 78%/cover no-repeat,linear-gradient(120deg,#12c2c4 0%,#28a7f0 48%,#8f6cf6 100%)}
.hero h1{margin:0;font-size:clamp(23px,6.6vw,40px);font-weight:900;letter-spacing:.3px;text-shadow:0 3px 0 rgba(0,0,0,.18),0 0 18px rgba(20,60,140,.35)}
.hero p{margin:4px 0 0;font-size:17px;font-weight:800;text-shadow:0 1px 6px rgba(20,60,140,.5)}
/* nút về: to, rõ */
.home{display:inline-flex;align-items:center;gap:6px;background:#fff;color:var(--brand-dark);font-weight:900;font-size:19px;text-decoration:none;border-radius:999px;padding:10px 22px;box-shadow:0 4px 0 rgba(0,0,0,.2);margin-bottom:12px}
.home:hover{background:#fff7d6}
.home:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
@media (min-width:900px){.home{position:absolute;left:clamp(12px,3vw,48px);top:20px;margin:0}}
/* nút âm thanh */
.snd{position:absolute;right:clamp(12px,3vw,48px);top:14px;z-index:3;width:50px;height:50px;border-radius:50%;border:none;background:#fff;font-size:23px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.snd:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
@media (max-width:520px){.snd{width:44px;height:44px;font-size:20px}}
/* tràn màn hình: dùng hết bề ngang */
main{position:relative;max-width:none;margin:-46px auto 0;padding:0 clamp(12px,3vw,48px) 140px}
.card{background:var(--card);border-radius:22px;padding:22px;margin-bottom:18px;border:3px solid #fff;box-shadow:0 6px 0 rgba(20,90,120,.08),0 8px 22px rgba(20,60,90,.08)}
@media (max-width:520px){.card{padding:16px 14px;border-radius:18px}}

/* nút kiểu game: nổi 3D, to */
.btn{font:inherit;font-weight:900;font-size:19px;border:none;border-radius:16px;padding:12px 26px;cursor:pointer;background:linear-gradient(180deg,#8b5cf6,#6a3fd1);color:#fff;box-shadow:0 5px 0 var(--brand-dark);transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--brand-dark)}
.btn.orange{background:linear-gradient(180deg,#ffa057,#ff7a2e);box-shadow:0 5px 0 #c9561a}
.btn.orange:active{box-shadow:0 2px 0 #c9561a}
.btn.green{background:linear-gradient(180deg,#3ddc84,#1fae63);box-shadow:0 5px 0 #157a45}
.btn.green:active{box-shadow:0 2px 0 #157a45}
.btn.lite{background:#fff;color:var(--brand);border:2.5px solid #d9cdfb;box-shadow:0 4px 0 #d9cdfb}
.btn.lite:active{box-shadow:0 1px 0 #d9cdfb}
.btn:disabled{opacity:.6;cursor:default}
.btn.dim{opacity:.5}
.linkbtn{background:none;border:none;color:var(--blue);font:inherit;font-size:15px;font-weight:700;cursor:pointer;text-decoration:underline;padding:0}
.muted{color:var(--muted)} .small{font-size:14.5px}

/* màn hình nhập tên */
.start{position:relative;max-width:760px;margin-left:auto;margin-right:auto}
.start h2{margin:0 0 4px;font-size:26px;color:#5a3fd6}
.start .smas{position:absolute;right:10px;top:-62px;width:104px;height:auto;pointer-events:none;animation:hop 2.6s ease-in-out infinite}
.field{display:flex;flex-direction:column;gap:4px;margin:14px 0}
.field label{font-weight:800;font-size:16.5px}
.field input{font:inherit;font-size:19px;padding:11px 14px;border:2.5px solid #d9dcec;border-radius:14px;outline:none;background:#fcfcff}
.field input:focus{border-color:var(--brand);background:#fff}
.err-msg{color:var(--bad);font-weight:800;font-size:15.5px;min-height:1em}
.okmsg{color:var(--ok);font-weight:800;font-size:16.5px;background:var(--ok-bg);border-radius:14px;padding:10px 14px;margin:0 0 14px}

/* avatar */
.av{display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:999px;background:#fff3c4;font-size:28px;line-height:1;overflow:hidden;flex:none;border:3px solid #fff;box-shadow:0 0 0 3px #ffd23f}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.big{width:88px;height:88px;font-size:52px}
.avbtn{position:relative;background:none;border:none;padding:0;cursor:pointer;flex:none}
.avbtn .avedit{position:absolute;right:-4px;bottom:-2px;background:#fff;border-radius:999px;width:22px;height:22px;font-size:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.avbox{margin:6px 0 4px}
.avbox.under{flex-basis:100%}
.avpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:8px}
.avopt{position:relative;aspect-ratio:1;border-radius:999px;border:3px solid transparent;background:var(--brand-soft);font-size:30px;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:0;overflow:hidden;transition:transform .12s}
.avopt:hover{transform:scale(1.08)}
.avopt.on{border-color:var(--accent);box-shadow:0 0 0 3px #ffd9bd;transform:scale(1.1)}
.avopt.ai{background:#fff}
.avopt.ai img{width:100%;height:100%;object-fit:cover;display:block}
.avopt.photo{background:#fff5df;border-style:dashed;border-color:#e0b25c}
.avopt.photo.on{border-style:solid;border-color:var(--accent)}
.avopt.photo small{font-size:10px;font-weight:800;color:#b7791f;margin-top:2px}
.avopt.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.avopt.photo.on small{display:none}
.who{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:16.5px}
.whoname{display:flex;align-items:center;gap:10px;min-width:0;flex-wrap:wrap}
.who b{color:var(--brand)}
.closed{text-align:center;color:var(--muted)}

/* ===== thanh màn chơi: 📒 1 2 3 4 5 6 ===== */
.lvls{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px 0;background:#fff;border-radius:22px;padding:12px;margin-bottom:16px;border:3px solid #fff;box-shadow:0 6px 0 rgba(20,90,120,.08),0 8px 22px rgba(20,60,90,.08);scroll-margin-top:calc(var(--stick,8px) + 4px)}
.lv{position:relative;font:inherit;font-weight:900;font-size:21px;width:52px;height:52px;border-radius:50%;border:3px solid #fff;background:#e6e9f2;color:#7a7f92;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.13);flex:none;display:flex;align-items:center;justify-content:center;padding:0;transition:transform .15s}
.lv.full{background:linear-gradient(135deg,#ffd23f,#ff9a3d);color:#fff}
.lv.ok{background:linear-gradient(135deg,#3ddc84,#1fae63);color:#fff}
.lv.bad{background:linear-gradient(135deg,#ff8a8a,#e04848);color:#fff}
.lv.cur{transform:scale(1.2);box-shadow:0 0 0 4px #8b5cf6,0 4px 0 rgba(0,0,0,.13);z-index:1}
.lv i{position:absolute;right:-7px;top:-7px;font-style:normal;font-size:12px;background:#fff;color:var(--ink);border-radius:50%;width:23px;height:23px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.lv.pop{animation:popin .5s}
.lvln{flex:0 1 26px;min-width:5px;height:6px;background:#e6e9f2;border-radius:9px}
@media (max-width:520px){.lvls{padding:10px 6px}.lv{width:38px;height:38px;font-size:16px;border-width:2px}.lvln{flex:1 1 2px;min-width:2px;max-width:10px}.lv i{width:18px;height:18px;font-size:9.5px;right:-6px;top:-7px}}
@media (max-width:350px){.lv{width:33px;height:33px;font-size:15px}}
.lvoff{display:none!important}
/* nút Back / Next cuối mỗi bài */
.lvnav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px;padding-top:16px;border-top:3px dashed var(--line);flex-wrap:wrap}
.lvnav .next{margin-left:auto;font-size:21px;padding:13px 30px}
.lvend{flex:1;min-width:220px;text-align:center;font-weight:800;color:#b4531a;background:#fff4e6;border:2px dashed #ffc46b;border-radius:16px;padding:10px 14px;line-height:1.45}

/* đầu bài */
.ex-head{display:flex;gap:12px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.badge{background:linear-gradient(90deg,#ff7a2e,#ff4f8b);color:#fff;font-weight:900;border-radius:12px;padding:4px 14px;font-size:18px;flex:none;box-shadow:0 3px 0 #c9406a}
.ex-head h2{font-size:23px;margin:0;color:#5a3fd6}
/* gấu trúc đọc đề */
.coach{display:flex;align-items:flex-end;gap:10px;margin:4px 0 14px}
.coach img{width:70px;height:auto;flex:none}
.how{position:relative;flex:1;margin:0;background:#f3efff;border-radius:18px;padding:10px 16px;font-size:18px;color:var(--ink)}
.how::before{content:"";position:absolute;left:-10px;bottom:16px;border:10px solid transparent;border-right-color:#f3efff;border-left:0}
.how b{color:var(--brand-dark)}
.how .vn{display:block;margin-top:2px;font-size:16px;color:var(--muted)}
@media (max-width:520px){.coach img{width:54px}.how{font-size:17px}}

/* audio: dính ở đầu màn hình khi lướt trong bài (--stick = dưới thanh "Try 1" nếu có) */
.listen{background:linear-gradient(90deg,#e3f2ff,#efe9ff);border-radius:18px;padding:10px 14px;margin-bottom:12px;position:sticky;top:var(--stick,8px);z-index:30;border:3px solid #fff;box-shadow:0 4px 14px rgba(30,40,110,.18)}
.listen .lt{font-weight:900;font-size:17px;color:var(--blue)}
.player{display:block;width:100%;height:42px;margin:4px 0 2px}

/* hình + nhãn trên hình: hình luôn vừa màn hình */
.pic{position:relative;width:fit-content;max-width:100%;margin:4px auto 14px;border-radius:16px;overflow:hidden;border:3px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.1);user-select:none;-webkit-user-select:none}
.pic img{display:block;width:auto;max-width:100%;height:auto;max-height:min(72vh, calc(100vh - 210px))}
.pic.small{max-width:640px;margin-left:auto;margin-right:auto}
.mk{position:absolute;transform:translate(-50%,-50%);font:inherit;font-weight:900;font-size:16px;line-height:1.2;border-radius:999px;padding:3px 11px;min-width:32px;text-align:center;
  background:var(--brand);color:#fff;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);white-space:nowrap}
.mk.example{background:#0fb5c9}
button.mk{cursor:pointer;background:#fff;color:var(--brand);border:2.5px dashed var(--brand)}
button.mk.on{background:var(--brand);color:#fff;border-style:solid;animation:popin .35s}
button.mk.ok{background:var(--ok);color:#fff;border:2px solid #fff}
button.mk.bad{background:var(--bad);color:#fff;border:2px solid #fff}
button.mk:disabled{cursor:default}
button.mk .fx{display:block;font-size:12px;font-weight:700;opacity:.95}
@media (max-width:520px){.mk{font-size:13px;padding:2px 7px;min-width:26px}}

/* thẻ tên */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
.chip{font:inherit;font-weight:900;font-size:18px;border-radius:999px;padding:6px 16px;border:2.5px solid #d9dcec;background:#fff;color:var(--ink);cursor:pointer;box-shadow:0 3px 0 #d9dcec}
.chip.sel{border-color:var(--accent);background:#fff1e6;color:#c9661f;box-shadow:0 0 0 3px #ffd9bd;transform:scale(1.05)}
.chip.used{background:var(--brand-soft);border-color:var(--brand-soft);color:var(--brand);box-shadow:none}
.chip.example{background:#e0f8fb;border-color:#e0f8fb;color:#0b8a99;cursor:default;box-shadow:none}
.chip:disabled{cursor:default}
.tip{font-size:15px;color:var(--muted);margin:-4px 0 8px;min-height:1.2em}
.tip b{color:#c9661f}

/* ô gõ chữ */
.cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(170px,100%),1fr));gap:12px 16px}
@media (max-width:520px){.cells{gap:10px 10px}}
.cell{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cell .cn{font-weight:900;color:var(--brand);min-width:26px;text-align:right}
.cell .cn.mk2{background:var(--brand);color:#fff;border-radius:999px;min-width:32px;text-align:center;padding:0 6px}
.cell.ex0 .cn{color:#0b8a99}
.cell.ex0 .exv{font-weight:900;color:#0b8a99;border-bottom:3px solid #9fdde5;padding:2px 8px;flex:1}
input.txt{font:inherit;font-size:20px;font-weight:800;color:var(--blue);border:2px solid transparent;border-bottom:3px solid #b3b8cc;background:#f2f4fa;border-radius:10px 10px 4px 4px;padding:5px 10px;outline:none;min-width:0;margin:2px}
.cell input.txt{flex:1}
input.txt:focus{border-color:#c9b8ff;border-bottom-color:var(--brand);background:#f6f2ff}
input.txt.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
input.txt.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
input.txt:disabled{opacity:1;-webkit-text-fill-color:currentColor}
.fix{font-size:15px;font-weight:800;color:var(--ok)}
.fix:empty{display:none}
.cell .fix{flex-basis:100%;padding-left:32px;line-height:1.3}
.fix.hint{color:var(--wait);font-weight:700}

/* bảng câu / phiếu */
.tbl{border:3px solid #b8e05a;border-radius:16px;overflow:hidden}
.tbl .tt{background:#b8e05a;text-align:center;font-weight:900;padding:6px;font-size:19px}
.tbl.form{border-color:#cfd3e3}
.tbl.form .tt{background:#f4f5fb;font-size:20px}
.row{display:grid;grid-template-columns:38px 1fr minmax(170px,1.05fr);border-top:1px solid #e9ecd9;align-items:center}
.row:first-of-type{border-top:none}
.row .rn{font-weight:900;color:var(--brand);text-align:center;align-self:stretch;display:flex;align-items:center;justify-content:center;background:#f1f9dd}
.tbl.form .row .rn{background:#f7f8fc}
.row .rq{padding:8px 10px}
.row .ra{padding:6px 10px;background:#fffbea;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.tbl.form .row .ra{background:#fff}
.row>*{min-width:0}
.row .ra input.txt{flex:1 1 90px;min-width:0}
.row .ra .exv{font-weight:900;color:#0b8a99;border-bottom:3px solid #9fdde5;padding:2px 8px;flex:1}
.row .ra .fix{flex-basis:100%}
.row.ex0 .rn{color:#0b8a99}
@media (max-width:560px){
  .row{grid-template-columns:32px 1fr}
  .row .rq{padding-bottom:2px}
  .row .ra{grid-column:2;background:transparent;padding-top:0}
}

/* nhận xét bài nối tên */
.fb{display:none;margin-top:10px;border-radius:14px;padding:10px 14px;font-size:16px;line-height:1.55}
.fb.show{display:block}
.fb.ok{background:var(--ok-bg);border-left:5px solid var(--ok)}
.fb.bad{background:var(--bad-bg);border-left:5px solid var(--bad)}

/* kết quả */
.summary{display:flex;gap:18px;align-items:center;flex-wrap:wrap;border-color:#d9cdfb;background:linear-gradient(180deg,#fff,#f7f3ff)}
.score{font-size:54px;font-weight:900;color:var(--brand);line-height:1}
.score span{font-size:26px;color:var(--muted)}
.stline{font-size:30px;line-height:1;margin:6px 0 2px}
.stline .off{filter:grayscale(1);opacity:.3}
.secs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.sec{background:#eceef6;border-radius:999px;padding:2px 12px;font-weight:800;font-size:14.5px}
.sec.full{background:var(--ok-bg);color:var(--ok)}
.meme{width:170px;max-width:42vw;height:auto;border-radius:16px;box-shadow:0 3px 10px rgba(0,0,0,.18);flex:none}
.status{font-weight:800;font-size:15.5px;margin-top:6px}
.status.ok{color:var(--ok)} .status.err,.status.warn{color:var(--bad)} .status.sending{color:var(--muted)}
.tease{margin:8px 0 4px;background:#fff4d6;border:2px solid #ffc46b;color:#b4531a;border-radius:14px;padding:8px 12px;font-weight:800;font-size:16.5px;line-height:1.45}
.tease.good{background:#e7f9ee;border-color:#7fd6a2;color:#17804a}

/* thanh dưới cùng */
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);border-top:3px solid #efe9ff;padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:40;backdrop-filter:blur(6px)}
.bar-in{max-width:none;margin:0 auto;display:flex;align-items:center;gap:14px}
.prog{flex:1;min-width:0}
.prog .t{font-size:15px;font-weight:800;color:var(--muted)}
.prog .track{height:14px;background:#eee6d6;border-radius:99px;overflow:hidden;margin-top:3px;box-shadow:inset 0 2px 3px rgba(0,0,0,.1)}
.prog .fill{height:100%;background:linear-gradient(90deg,#ffd23f,#ff8a3d);width:0;transition:width .3s;border-radius:99px}
/* sau lần 1: thanh ghim đầu màn hình + chế độ chỉ hiện câu sai */
.topbar{position:sticky;top:8px;z-index:45;display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;background:#fff4e6;border:3px solid var(--accent);border-radius:18px;padding:10px 14px;margin-bottom:16px;box-shadow:0 6px 18px rgba(0,0,0,.14)}
.topbar .tt{flex:1;min-width:160px;font-weight:900;font-size:17.5px;line-height:1.35}
.topbar .btn{padding:11px 18px}
.rt-hide{display:none!important}
body.retrying #summaryBox,body.retrying #whoBar,body.retrying .words{display:none}

/* nhiệm vụ + từ mới */
.words h2{margin:0 0 6px;font-size:23px;color:#5a3fd6}
.mission{margin:0 0 16px;padding-left:24px;font-size:18px}
.mission li{margin:3px 0}
.note{background:#fff7d6;border:2px dashed #f0c419;border-radius:14px;padding:8px 14px;font-size:17px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(240px,100%),1fr));gap:6px 16px;margin-top:10px}
.vi{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;background:#fffdf3;border:2px solid #fff1b8;border-radius:14px;padding:6px 10px}
.vipa{font-size:14px;color:var(--muted)} .vmean{font-size:16px;flex-basis:100%}
.aw{margin:16px 0 0;font-size:19px;color:var(--ok)}
/* từ highlight: chạm xem nghĩa + máy đọc */
.vw{font:inherit;font-weight:900;color:#5a4300;background:#fff1a6;border:none;border-bottom:2px solid #f0c419;border-radius:6px;padding:0 4px;margin:0 1px;cursor:pointer;line-height:1.35}
.vw:hover{background:#ffe46b}
.pop{position:absolute;z-index:60;background:#fff;border:3px solid #f0c419;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:10px 14px}
.pop .pw{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:22px}
.pop .say{font-size:22px;background:var(--brand-soft);border:none;border-radius:10px;padding:2px 10px;cursor:pointer}
.pop .pi{color:var(--muted);font-size:15px}
.pop .pv{font-weight:800;font-size:17.5px;color:var(--brand-dark)}

/* bài nối tên: tranh bên trái, khung tên bên phải dính theo khi cuộn */
.dz{display:flex;justify-content:center;align-items:flex-start;gap:18px}
.dz-work{min-width:0;flex:0 1 auto}
.dz .pic{margin-top:0}
.dz-side{flex:0 0 200px;position:sticky;top:calc(var(--stick,8px) + var(--lh,84px) + 8px);z-index:5}

/* ============ ĐANG XEM TRANG NÀO ============ */
// ./ = trang chủ (bản đồ). ./?w=N = bài của tuần N (chỉ mở tuần ≤ OPEN_WEEK). ?lamlai=… không có w = tuần đang mở.

/* ============ TIỆN ÍCH ============ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const squash = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]/g, '');
const alts = k => String(k || '').split('|').map(x => x.trim()).filter(Boolean);
const firstAlt = k => alts(k)[0] || '';
const check = (ans, key) => alts(key).some(a => squash(a) === squash(ans));
const ia = 'autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"';
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ============ ÂM THANH (tự tạo bằng WebAudio, không cần file) + PHÁO HOA ============ */
const SND_KEY = 'a1kid-sound';
let AC = null;
const soundOn = () => lsGet(SND_KEY) !== false;
const TUNES = {
  pop:[[660, .05], [990, .07]], tick:[[880, .05]], ok:[[660, .08], [880, .08], [1320, .14]],
  bad:[[200, .2]], win:[[523, .1], [659, .1], [784, .1], [1047, .34]], badge:[[784, .1], [988, .1], [1175, .1], [1568, .36]],
};
function sfx(kind){
  if (!soundOn() || !TUNES[kind]) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    let t = AC.currentTime + .01;
    TUNES[kind].forEach(([f, d]) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = kind === 'bad' ? 'square' : 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(kind === 'bad' ? .05 : .16, t + .012);
      g.gain.exponentialRampToValueAtTime(.0001, t + d);
      o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d + .03); t += d * .9;
    });
  } catch (e) {}
}
function paintSnd(){
  const b = $('#sndBtn');
  b.textContent = soundOn() ? '🔊' : '🔇';
  b.title = soundOn() ? 'Sound off' : 'Sound on';
}
$('#sndBtn').addEventListener('click', () => { lsSet(SND_KEY, !soundOn()); paintSnd(); sfx('tick'); });
function confetti(n){
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  n = reduce ? 30 : (n || 150);
  const box = document.createElement('div'); box.className = 'confetti';
  const C = ['#ff4f8b', '#ffd23f', '#2bd47d', '#28a7f0', '#8f6cf6', '#ff8a3d'];
  for (let i = 0; i < n; i++){
    const p = document.createElement('i');
    p.style.left = Math.random() * 100 + 'vw'; p.style.background = C[i % C.length];
    p.style.animationDelay = Math.random() * .7 + 's'; p.style.animationDuration = 2.2 + Math.random() * 1.8 + 's';
    p.style.setProperty('--dx', Math.round(Math.random() * 200 - 100) + 'px'); p.style.setProperty('--r', Math.round(Math.random() * 900) + 'deg');
    if (i % 3 === 0) p.style.borderRadius = '50%';
    box.appendChild(p);
  }
  document.body.appendChild(box); setTimeout(() => box.remove(), 5000);
}

/* ============ TỪ MỚI: highlight → bong bóng nghĩa + máy đọc ============ */
const VRE = /\{\{([^}|]+)(?:\|([^}]+))?\}\}/g;
const vt = s => String(s || '').replace(VRE, (_, k, shown) =>
  VOCAB[k] ? `<button type="button" class="vw" data-v="${esc(k)}">${esc(shown || k)}</button>` : esc(shown || k));
const unv = s => String(s || '').replace(VRE, (_, k, shown) => shown || k);
let VOICE = null;
function pickVoice(){
  try {
    const vs = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
    VOICE = vs.find(v => /^en[-_]GB/i.test(v.lang) && /female|libby|sonia|serena|kate|hazel|google uk english female/i.test(v.name)) ||
      vs.find(v => /^en[-_]GB/i.test(v.lang)) || vs.find(v => /^en[-_]US/i.test(v.lang)) || vs[0] || null;
  } catch (e) {}
}
if ('speechSynthesis' in window){ pickVoice(); try { speechSynthesis.onvoiceschanged = pickVoice; } catch (e) {} }
function say(text){
  try {
    if (!('speechSynthesis' in window) || !text) return;
    speechSynthesis.cancel(); try { speechSynthesis.resume(); } catch (e) {}
    const u = new SpeechSynthesisUtterance(text);
    u.lang = VOICE ? VOICE.lang : 'en-GB'; if (VOICE) u.voice = VOICE; u.rate = .85;
    speechSynthesis.speak(u);
  } catch (e) {}
}
function showPop(btn){
  const v = VOCAB[btn.dataset.v]; if (!v) return;
  const p = $('#pop');
  p.innerHTML = `<div class="pw"><b>${esc(v.w)}</b> <button type="button" class="say" aria-label="Listen again">🔊</button></div>
    <div class="pi">${esc(v.ipa || '')}</div><div class="pv">${esc(v.vi)}</div>`;
  p.hidden = false;
  const r = btn.getBoundingClientRect(), pw = Math.min(290, window.innerWidth - 24);
  p.style.width = pw + 'px';
  let left = r.left + r.width / 2 - pw / 2 + window.scrollX;
  left = Math.max(12 + window.scrollX, Math.min(left, window.scrollX + window.innerWidth - pw - 12));
  p.style.left = left + 'px';
  const h = p.offsetHeight, below = r.bottom + 8 + h < window.innerHeight || r.top < h + 16;
  p.style.top = (below ? r.bottom + 8 : r.top - h - 8) + window.scrollY + 'px';
  $('.say', p).onclick = () => say(v.w);
  say(v.w);
}
const hidePop = () => { const p = $('#pop'); if (p) p.hidden = true; };
document.addEventListener('click', e => {
  const b = e.target.closest('.vw');
  if (b){ e.preventDefault(); e.stopPropagation(); showPop(b); return; }
  if (!e.target.closest('#pop')) hidePop();
}, true);
window.addEventListener('resize', hidePop);

function lev(a, b){
  const d = Array.from({length:a.length + 1}, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}
// Gợi ý cho câu sai (không lộ đáp án)
function hintFor(i){
  const e = WEEK.ex.find(x => x.id === i.sec);
  if (e.type === 'picTag') return 'Listen again. Look at their clothes and what they are doing.';
  if (!i.ans) return 'You didn’t answer this.';
  const y = squash(i.ans);
  const near = alts(i.keyRaw).some(a => { const x = squash(a); return x.length >= 4 && lev(x, y) <= Math.max(1, Math.floor(x.length / 4)); });
  if (near) return 'Almost! Check your spelling.';
  if (e.type === 'picWrite') return 'Listen again to the spelling of the name.';
  if (e.type === 'list' && e.numeric) return 'Careful: fifteen = 15, fifty = 50.';
  if (e.type === 'list') return 'Listen again and write every letter.';
  return 'Listen again to this part.';
}
function snap(R){
  const ok = {}, ans = {}, hint = {};
  R.items.forEach(i => { ok[i.key] = i.ok; ans[i.key] = i.ans; if (i.ok === false) hint[i.key] = hintFor(i); });
  return {score:R.score, total:R.total, ok, ans, hint, tag:Object.assign({}, S.tag),
    sections:R.sections.map(s => ({id:s.id, title:s.title, score:s.score, total:s.total, pending:false})),
    items:R.items.map(i => ({sec:i.sec, n:i.n, q:i.q, ans:i.ans, correct:i.correct, ok:i.ok}))};
}

        S.tag[k] = n; selName[e.id] = null; sfx('pop');
      } else if (S.tag[k]) delete S.tag[k];
      else { $('#tip-' + e.id).innerHTML = '👆 Tap a <b>name</b> first.'; return; }
      save(); renderTags(e); progress();
    });
    renderTags(e);
  });
  // nút Back / Next và thanh màn chơi
  $('#exList').addEventListener('click', ev => { const b = ev.target.closest('[data-go]'); if (b){ sfx('pop'); showLevel(b.dataset.go, true); } });
  $('#lvls').addEventListener('click', ev => { const b = ev.target.closest('.lv'); if (b){ sfx('tick'); showLevel(b.dataset.s, true); } });
  document.addEventListener('play', ev => $$('audio').forEach(a => { if (a !== ev.target) a.pause(); }), true);
}

function renderTags(e){
  const used = Object.keys(S.tag).filter(x => x.startsWith(e.id + '-')).map(x => S.tag[x]);
  $('#chips-' + e.id).innerHTML = `<button type="button" class="chip example" disabled>${esc(e.example.label)} ✓</button>` +
    e.names.map(n => `<button type="button" class="chip${selName[e.id] === n ? ' sel' : used.includes(n) ? ' used' : ''}" data-n="${esc(n)}" ${nameLocked(e, n) ? 'disabled' : ''}>${esc(n)}</button>`).join('');
  $('#tip-' + e.id).innerHTML = S.done ? '' : selName[e.id] ? `Now tap the <b>?</b> on <b>${esc(selName[e.id])}</b>.` : '';
  $$(`#pic-${e.id} button.mk`).forEach(b => {
    const m = e.marks.find(x => x.k === b.dataset.m), k = e.id + '-' + m.k, v = S.tag[k] || '';
    let cls = 'mk', html = v ? esc(v) : '?';
    if (S.done){
      const right = m.key ? v === m.key : !v;
      if (v || m.key){
        cls += right ? ' ok' : ' bad';
        if (!right) html = (v ? `<s>${esc(v)}</s>` : '?') + (m.key ? `<span class="fx">→ ${esc(m.key)}</span>` : '');
      }
    } else if (fixing()){
      if (m.key && S.r1.tag[k] === m.key) cls += ' ok';
      else if (v) cls += S.r1.tag[k] === v ? ' bad' : ' on';
    } else if (v) cls += ' on';
    if (b.className !== cls) b.className = cls;
    b.innerHTML = html; b.disabled = markLocked(e, m);
  });
}

/* ============ MÀN CHƠI: mỗi lần hiện 1 bài ============ */
// Các màn: 'w' (từ mới) rồi từng bài. Lúc sửa câu sai: chỉ các bài còn câu sai.
function stepIds(){
  if (!WEEK) return [];
  if (retrying()){ const w = wrongKeys().map(secOf); return WEEK.ex.filter(e => w.includes(e.id)).map(e => e.id); }
  return ['w'].concat(WEEK.ex.map(e => e.id));
}
const curStep = () => { const ids = stepIds(); return ids.includes(S.lv) ? S.lv : ids[0]; };
const exNo = id => WEEK.ex.findIndex(e => e.id === id) + 1;
// các câu của 1 bài đã làm chưa
function answeredOf(e){
  if (e.type === 'picTag'){
    const n = Object.keys(S.tag).filter(x => x.startsWith(e.id + '-')).length, need = e.marks.filter(m => m.key).length;
    return Array.from({length:need}, (_, i) => i < n);
  }
  return $$(`#ex${e.id} input.txt`).map(el => !!(S.t[el.dataset.k] || '').trim());
}
const answeredList = () => WEEK ? WEEK.ex.flatMap(answeredOf) : [];
const firstIncomplete = () => WEEK.ex.find(e => answeredOf(e).some(x => !x));
// màu của nút màn: full = làm đủ, ok = đúng hết, bad = còn câu sai
function lvState(id){
  if (id === 'w') return '';
  if (S.done && RES){ const s = RES.sections.find(x => x.id === id); return s && s.score === s.total ? 'ok' : 'bad'; }
  if (fixing()){
    const w = wrongKeys().filter(k => secOf(k) === id).length;
    if (!w) return 'ok';
    return retrying() && changedCount(id) >= w ? 'full' : 'bad';
  }
  const a = answeredOf(WEEK.ex.find(e => e.id === id));
  return a.length && a.every(Boolean) ? 'full' : '';
}
const MARK = {full:'✓', ok:'⭐', bad:'✗'};
function renderLvls(){
  const nav = $('#lvls'), ids = stepIds(), cur = curStep();
  nav.hidden = !ids.length;
  nav.innerHTML = ids.map((id, i) => {
    const st = lvState(id), n = id === 'w' ? '📒' : exNo(id);
    return (i ? '<i class="lvln"></i>' : '') +
      `<button type="button" class="lv${st ? ' ' + st : ''}${id === cur ? ' cur' : ''}" data-s="${id}" aria-label="${id === 'w' ? 'New words' : 'Level ' + n}">${n}${st ? `<i>${MARK[st]}</i>` : ''}</button>`;
  }).join('');
}
function showLevel(id, scroll){
  const ids = stepIds(); if (!ids.length) return;
  if (!ids.includes(id)) id = ids[0];
  if (S.lv !== id){ S.lv = id; save(); }
  $$('#exList > section.card').forEach(sec => sec.classList.toggle('lvoff', sec.dataset.s !== id));
  $$('audio').forEach(a => a.pause());
  hidePop();
  const i = ids.indexOf(id), prev = ids[i - 1], next = ids[i + 1], nav = $(`#exList > section[data-s="${id}"] .lvnav`);
  if (nav){
    let end = '';
    if (!next && !S.submitted) end = '<div class="lvend">🏁 Last level! Check your answers, then press <b>Submit ✔</b> at the bottom.</div>';
    else if (!next && retrying()) end = '<div class="lvend">🏁 All fixed? Press <b>Submit again ✔</b> at the top.</div>';
    nav.innerHTML = (prev ? `<button class="btn lite" type="button" data-go="${prev}">◀ Back</button>` : '<span></span>') + end +
      (next ? `<button class="btn green next" type="button" data-go="${next}">${id === 'w' ? 'Let’s start! ▶' : 'Next level ▶'}</button>` : '');
  }
  renderLvls(); setStick();
  if (scroll) $('#lvls').scrollIntoView({behavior:'smooth', block:'start'});
}

/* ============ TIẾN ĐỘ ============ */
let FULL = null; // các bài đã làm đủ (để kêu "ting" khi vừa xong 1 màn)
function progress(){
  if (!WEEK) return;
  if (S.done && RES){
    $('#progT').textContent = `Submitted${S.submittedAt2 ? ' (Try 2)' : ''} · ${RES.score}/${RES.total} correct`;
    $('#progF').style.width = (RES.total ? RES.score / RES.total * 100 : 100) + '%';
  } else if (fixing()){
    topProgress();
  } else {
    const a = answeredList(), done = a.filter(Boolean).length;
    $('#progT').textContent = `Done ${done}/${a.length}`;
    $('#progF').style.width = (a.length ? done / a.length * 100 : 0) + '%';
  }
  renderLvls();
  if (!S.submitted){
    const now = WEEK.ex.filter(e => { const a = answeredOf(e); return a.length && a.every(Boolean); }).map(e => e.id);
    if (FULL) now.filter(id => !FULL.includes(id)).forEach(id => {
      sfx('ok'); const b = $(`#lvls .lv[data-s="${id}"]`); if (b) b.classList.add('pop');
      toast(`⭐ Level ${exNo(id)} complete!`, 1800);
    });
    FULL = now;
  }
}

/* ============ CHẤM ĐIỂM ============ */
function grade(){
  const items = [];
  const text = (sec, k, n, q, key) => {
    const ans = (S.t[k] || '').trim();
    items.push({sec, key:k, n:String(n), q, ans, correct:firstAlt(key), keyRaw:key, ok:check(ans, key)});
  };
  WEEK.ex.forEach(e => {
    if (e.type === 'picWrite') e.marks.forEach(m => text(e.id, e.id + '-' + m.k, m.k, 'Tên người ' + m.k + ' trong tranh', m.key));
    else if (e.type === 'list') e.items.forEach((key, j) => text(e.id, e.id + '-' + (j + 1), j + 1, (e.numeric ? 'Số câu ' : 'Từ câu ') + (j + 1), key));
    else if (e.type === 'table') e.rows.forEach((r, j) => text(e.id, e.id + '-' + (j + 1), j + 1, unv([r[0], r[1], '_____', r[3]].filter(Boolean).join(' ')), r[2]));
    else if (e.type === 'picTag') e.marks.filter(m => m.key).forEach(m => {
      const where = Object.keys(S.tag).find(x => x.startsWith(e.id + '-') && S.tag[x] === m.key);
      const ans = S.tag[e.id + '-' + m.k] || '';
      items.push({sec:e.id, key:tagKey(e, m.key), n:m.key, q:'Nối tên ' + m.key, ans:ans ? 'gắn ' + ans : (where ? 'gắn nhầm chỗ' : '(chưa nối)'), correct:m.key, ok:ans === m.key});
    });
  });
  const sections = WEEK.ex.map((e, i) => {
    const its = items.filter(x => x.sec === e.id);
    return {id:e.id, title:`Bài ${i + 1} · Track ${e.track} · ${unv(e.title)}`, score:its.filter(x => x.ok).length, total:its.length, pending:false};
  });
  return {items, sections, score:items.filter(x => x.ok).length, total:items.length};
}

/* ============ HIỂN THỊ KẾT QUẢ ============ */
// Sau lần 1: câu đúng xanh, câu sai đỏ (khoá hết). Khi bấm "Fix": câu sai mở ra + 💡 gợi ý. Chưa hiện đáp án.
function paintFixInput(el){
  const k = el.dataset.k, ok = r1ok(k), fix = $('#fix-' + k);
  el.classList.remove('ok', 'bad');
  if (ok === true){ el.classList.add('ok'); el.disabled = true; if (fix){ fix.className = 'fix'; fix.textContent = ''; } return; }
  el.disabled = !retrying();
  if ((S.t[k] || '').trim() === S.r1.ans[k]) el.classList.add('bad');
  if (fix){ fix.className = 'fix hint'; fix.textContent = retrying() ? '💡 ' + (S.r1.hint[k] || '') : ''; }
}
function showFix(){
  $$('input.txt').forEach(paintFixInput);
  WEEK.ex.filter(e => e.type === 'picTag').forEach(e => {
    renderTags(e);
    const wrong = S.r1.items.filter(i => i.sec === e.id && i.ok === false).length, fb = $('#fb-' + e.id);
    fb.className = 'fb show ' + (wrong ? 'bad' : 'ok');
    fb.innerHTML = !wrong ? '<b>✅ All correct!</b>'
      : retrying() ? `<b>Fix ${wrong} name${wrong > 1 ? 's' : ''}.</b> Red = wrong place.<br>💡 ${esc(hintFor({sec:e.id}))}`
      : `<b>❌ ${wrong} wrong.</b>`;
  });
  $('#bar').hidden = true; // nút ở thanh ghim đầu màn hình
  focusWrong(retrying());
  renderTop(); renderWho(); renderSummary(); progress();
}
function showFinal(){
  focusWrong(false); renderTop();
  if (WEEK) $('#bar').hidden = false;
  RES = grade();
  if (!S.final){ S.final = {score:RES.score, total:RES.total}; save(); }
  RES.items.forEach(i => {
    if (!i.key || i.key.includes(':')) return;
    const el = $(`input.txt[data-k="${i.key}"]`), fix = $('#fix-' + i.key);
    if (el){ el.disabled = true; el.classList.remove('ok', 'bad'); el.classList.add(i.ok ? 'ok' : 'bad'); }
    if (fix){ fix.className = 'fix'; fix.textContent = i.ok ? '' : '→ ' + i.correct; }
  });
  WEEK.ex.filter(e => e.type === 'picTag').forEach(e => {
    renderTags(e);
    const s = RES.sections.find(x => x.id === e.id), fb = $('#fb-' + e.id);
    fb.className = 'fb show ' + (s.score === s.total ? 'ok' : 'bad');
    fb.innerHTML = s.score === s.total ? '<b>✅ All correct!</b>' : `<b>${s.score}/${s.total}</b> · Red boxes show the answer (→).`;
  });
  $$('input.txt').forEach(el => el.disabled = true);
  $('#submitBtn').hidden = true;
  paintAfterWords(); renderWho(); renderSummary(); progress();
}
function render(){
  if (S.done) showFinal(); else if (fixing()) showFix();
  showLevel(curStep(), false);
}

// GIF meme sau mỗi lần nộp, theo điểm của lần đó: img/meme/<mức>-<số>.gif (bộ ảnh giống KET/PET).
// MEMES = số ảnh mỗi mức (thêm ảnh thì tăng số). Ưu tiên ảnh em chưa gặp; giữ cố định khi mở lại trang.
const MEMES = {wow:7, good:8, ok:8, oops:6};
const SEEN_KEY = 'a1kid-memes-seen';
function memeOf(R, field){
  const pct = R.total ? R.score / R.total : 1;
  const tier = pct === 1 ? 'wow' : pct >= .8 ? 'good' : pct >= .5 ? 'ok' : 'oops';
  if (!S[field] || !S[field].startsWith(tier + '-')){
    const all = Array.from({length:MEMES[tier]}, (_, i) => tier + '-' + (i + 1));
    let seen = lsGet(SEEN_KEY); if (!Array.isArray(seen)) seen = [];
    let pool = all.filter(m => !seen.includes(m));
    if (!pool.length){ seen = seen.filter(m => !m.startsWith(tier + '-')); pool = all; }
    S[field] = pool[Math.floor(Math.random() * pool.length)];
    seen.push(S[field]); lsSet(SEEN_KEY, seen);
    save();
  }
  return `<img class="meme" src="img/meme/${S[field]}.gif" alt="">`;
}
// Sao của 1 tuần đã xong: ≥90% → 3 sao, ≥70% → 2 sao, còn lại 1 sao
const starsFor = r => !r || !r.total ? 3 : r.score / r.total >= .9 ? 3 : r.score / r.total >= .7 ? 2 : 1;
const starLine = n => `<div class="stline">${[1, 2, 3].map(i => `<span class="${i <= n ? '' : 'off'}">⭐</span>`).join('')}</div>`;
// Lần 1 dưới 70% → câu động viên; lần 2 → câu khen theo số câu đã sửa đúng. Giữ cố định khi mở lại trang.
function teaseLine1(){
  const R = S.r1; if (!R || !R.total || R.score / R.total >= .7) return '';
  if (!S.tease1){ S.tease1 = tease('low1', {s:R.score, t:R.total, w:R.total - R.score}); save(); }
  return `<div class="tease">${S.tease1}</div>`;
}
function praiseLine2(){
  if (!S.tease2){
    const ks = wrongKeys(), f = RES.items.filter(i => ks.includes(i.key) && i.ok).length;
    S.tease2 = tease(f === ks.length ? 'fixAll' : f ? 'fixSome' : 'fixNone', {f}); save();
  }
  return `<div class="tease good">${S.tease2}</div>`;
}
function renderSummary(){
  let html;
  if (fixing()){
    const r = S.r1;
    html = `<div class="card summary">${memeOf(r, 'meme')}
      <div style="flex:1;min-width:220px">
        <div class="score">${r.score}<span>/${r.total}</span></div>
        <div class="secs">${r.sections.map((s, i) => `<span class="sec${s.score === s.total ? ' full' : ''}">Level ${i + 1}: ${s.score}/${s.total}</span>`).join('')}</div>
        ${teaseLine1()}
        <div style="font-size:15px;color:var(--muted)">Red = wrong. Press <b>✏️ Fix wrong answers</b> at the top.</div>
        <div class="status" id="sendStatus"></div>
      </div></div>`;
  } else {
    const pct = RES.total ? RES.score / RES.total : 0, two = S.r1 && S.submittedAt2;
    html = `<div class="card summary">${two ? memeOf(RES, 'meme2') : memeOf(S.r1 || RES, 'meme')}
      <div style="flex:1;min-width:220px">
        <div class="score">${RES.score}<span>/${RES.total}</span></div>
        ${starLine(starsFor(RES))}
        <div style="font-weight:900;font-size:20px">${RES.score === RES.total ? '🎉 All correct! Amazing!' : pct >= .8 ? '👏 Great job!' : pct >= .5 ? '💪 Good work!' : '📚 Keep trying!'}</div>
        ${two ? `<div style="font-weight:800">Try 1: ${S.r1.score}/${S.r1.total} → Try 2: ${RES.score}/${RES.total}</div>${praiseLine2()}` : ''}
        <div class="secs">${RES.sections.map((s, i) => `<span class="sec${s.score === s.total ? ' full' : ''}">Level ${i + 1}: ${s.score}/${s.total}</span>`).join('')}</div>
        <div style="font-size:15px;color:var(--muted)">Wrong answers show the right answer (→).</div>
        <div class="status" id="sendStatus"></div>
        <a class="btn lite" href="./" style="display:inline-block;margin-top:12px;text-decoration:none">🗺️ Back to the map</a>
      </div></div>`;
  }
  $('#summaryBox').innerHTML = html;
  updateStatus();
}

/* ============ GỬI BÀI ============ */
let sendState = null, sendErr = '', sending = false;
function updateStatus(){
  const el = $('#sendStatus'); if (!el) return;
  const allSent = S.sent && (!S.submittedAt2 || S.sent2);
  const st = allSent ? 'ok' : sendState;
  el.className = 'status ' + (st || '');
  if (st === 'ok') el.innerHTML = fixing() ? '✅ Your teacher got Try 1.' : S.submittedAt2 ? '✅ Your teacher got Try 2!' : '✅ Your teacher got your work!';
  else if (st === 'sending') el.innerHTML = '⏳ Sending to your teacher…';
  else if (st === 'warn') el.innerHTML = '⚠️ Trang chưa được cài địa chỉ gửi bài (SCRIPT_URL), nên bài chưa được gửi cho cô.';
  else if (st === 'err') el.innerHTML = `⚠️ Chưa gửi được bài${sendErr ? ` (${esc(sendErr)})` : ''}. Em kiểm tra mạng rồi bấm: <button class="btn" type="button" id="resendBtn" style="padding:6px 14px;font-size:15px;margin-left:4px">Gửi lại</button>`;
  else el.innerHTML = '';
  const rb = $('#resendBtn'); if (rb) rb.onclick = send;
}
function base(){ return {app:'btvn', unit:UNIT, title:TITLE + (S.redo ? ' – LÀM LẠI' + (S.redo > 1 ? ' lần ' + S.redo : '') : ''), redo:S.redo || 0, name:S.name, cls:S.cls, sid:S.sid || '', wantsAudio:false, audio:null}; }
function payload1(){
  const r = S.r1 || snap(grade());
  return Object.assign(base(), {attempt:1, canRetry:!!S.r1 && r.items.some(i => i.ok === false),
    submittedAt:S.submittedAt, startedAt:S.startedAt || null, leaves:S.leaves || 0, timeTakenSec:durSec(S.startedAt, S.submittedAt),
    score:r.score, total:r.total, sections:r.sections, items:r.items});
}
function payload2(){
  const R = grade(), r = S.r1;
  return Object.assign(base(), {attempt:2,
    submittedAt:S.submittedAt2, startedAt:S.retryAt || S.submittedAt, leaves:S.leaves2 || 0, timeTakenSec:durSec(S.retryAt || S.submittedAt, S.submittedAt2),
    score:R.score, total:R.total,
    sections:R.sections.map(s => ({id:s.id, title:s.title, score:s.score, total:s.total, pending:false})),
    items:R.items.map(i => ({sec:i.sec, n:i.n, q:i.q, ans:i.ans, correct:i.correct, ok:i.ok})),
    first:{score:r.score, total:r.total, sections:r.sections, items:r.items,
      startedAt:S.startedAt || null, submittedAt:S.submittedAt, timeTakenSec:durSec(S.startedAt, S.submittedAt), leaves:S.leaves || 0}});
}
async function post(p){
  const tk = window.YumiAuth && YumiAuth.token(); if (tk) p.token = tk; // đã đăng nhập → máy chủ ghi đúng tên + tính XP
  const r = await fetch(SCRIPT_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(p)});
  const j = await r.json();
  if (!j.ok && j.auth && window.YumiAuth){ await YumiAuth.authFailed(YA_OPTS); return post(p); } // hết phiên → đăng nhập lại rồi gửi lại
  if (!j.ok) throw new Error(j.error || 'máy chủ báo lỗi');
}
async function send(){
  if (!SCRIPT_URL || SCRIPT_URL.includes('PASTE_')){ sendState = 'warn'; updateStatus(); return; }
  if (sending) return; // đang gửi: vòng lặp bên dưới sẽ tự gửi tiếp lần 2
  sending = true; sendState = 'sending'; updateStatus();
  try {
    for (;;){
      if (!S.sent){ await post(payload1()); S.sent = true; save(); continue; }
      if (S.submittedAt2 && !S.sent2){ await post(payload2()); S.sent2 = true; save(); continue; }
      break;
    }
    sendState = 'ok';
  } catch (err){
    sendState = 'err'; sendErr = err && err.message ? err.message : String(err);
  }
  sending = false; updateStatus();
}

/* ============ NỘP BÀI ============ */
// sau mỗi lần nộp: tiếng + pháo hoa (đúng hết) + huy hiệu mới
function afterSubmit(){
  const r = S.done ? grade() : S.r1;
  if (r.score === r.total){ confetti(); sfx('win'); } else sfx('ok');
  if (S.done) setTimeout(checkBadges, 2400);
}
$('#submitBtn').addEventListener('click', async () => {
  if (S.submitted || !WEEK || !$('#modal').hidden) return;
  const a = answeredList(), done = a.filter(Boolean).length, left = a.length - done;
  if (left > a.length * MAX_EMPTY){
    await modal(`📝 ${tease('empty', {x:done, n:a.length, e:left})}`, '', 'Dạ, em làm tiếp ✏️');
    const f = firstIncomplete(); if (f) showLevel(f.id, true); // đưa em tới màn còn thiếu
    return;
  }
  const mins = S.startedAt ? (Date.now() - new Date(S.startedAt)) / 60000 : MIN_MINUTES;
  if (mins < MIN_MINUTES){
    await modal(`⏱️ ${tease('early', {r:Math.ceil(MIN_MINUTES - mins)})}`, '', 'Dạ, em kiểm tra lại 🧐');
    return;
  }
  const go = await modal(left ? `Em còn <b>${left} câu</b> chưa làm.<br>Em chắc chắn muốn nộp bài cho cô?` : 'Em đã kiểm tra kĩ chưa?<br>Nộp bài cho cô nhé?', 'Nộp bài', 'Làm tiếp ✏️');
  if (!go || S.submitted) return;
  $$('audio').forEach(x => x.pause());
  Object.keys(selName).forEach(k => selName[k] = null);
  S.submitted = true; S.submittedAt = new Date().toISOString(); S.sid = makeSid();
  S.r1 = snap(grade());
  if (!S.r1.items.some(i => i.ok === false)) S.done = true; // đúng hết thì không cần lần 2
  S.lv = S.done ? 'w' : firstWrongSec();

// thu ảnh về hình vuông 200px (cắt giữa) cho nhẹ, lưu được trong máy
function shrinkImg(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const w = im.naturalWidth, h = im.naturalHeight, s = Math.min(w, h);
      URL.revokeObjectURL(url); if (!s) return rej(new Error('empty'));
      const c = document.createElement('canvas'); c.width = c.height = 200;
      c.getContext('2d').drawImage(im, (w - s) / 2, (h - s) / 2, s, s, 0, 0, 200, 200);
      res(c.toDataURL('image/jpeg', .85));
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('bad image')); };
    im.src = url;
  });
}

const isDone = s => !!(s.done || (s.submitted && !s.r1));
const starsOf = s => isDone(s) ? starsFor(s.final || s.r1) : 0;
function gameData(){
  const weeks = Object.keys(WEEKS).map(Number).filter(w => w <= OPEN_WEEK).sort((a, b) => a - b);
  const states = weeks.map(w => ({w, W:WEEKS[w], s:lsGet(storeKey(w)) || {}}));
  const rev = Object.assign({plays:0, best:0, stars:0, days:{}}, lsGet(REV_KEY) || {});
  const pet = petGet();
  let lessonStars = 0, done = 0, run = 0, maxStreak = 0;
  // pool = từ dùng trong trò chơi (từ New words mở ngay từ đầu tuần; từ là đáp án chỉ mở sau khi nộp xong)
  // learned = từ của các tuần đã làm xong (đếm "new words", huy hiệu Word Hunter)
  const pool = [], learned = [], gram = [];
  const add = (arr, k) => { if (VOCAB[k] && !arr.includes(k)) arr.push(k); };
  states.forEach(x => {
    const n = starsOf(x.s); lessonStars += n;
    (x.W.newWords || []).forEach(k => add(pool, k));
    (x.W.gram || []).forEach(g => { if (!g.after || isDone(x.s)) gram.push(g); });
    if (isDone(x.s)){ done++; (x.W.newWords || []).concat(x.W.newWordsAfter || []).forEach(k => { add(pool, k); add(learned, k); }); }
    run = isDone(x.s) ? run + 1 : 0; maxStreak = Math.max(maxStreak, run);
  });
  // sao = sao bài tuần + sao Quick review cũ (trước khi có thú cưng) + thức ăn đã cho thú cưng ăn
  return {weeks, states, rev, pet, stars:lessonStars + (rev.stars || 0) + pet.food, words:learned.length, done, maxStreak, pool, gram};
}

/* ============ THÚ CƯNG: trứng → nở → lớn ============ */
// Thức ăn 🍎 = sao kiếm được ở các trò ôn bài (ngoài bài cô giao). Mỗi ngày cho ăn tối đa FOOD_DAY.

const PET_KEY = 'a1kid-pet', FOOD_DAY = 5, CRACK = 18, HATCH = 35, GROW = 80;
const PETS = {p1:{name:'Dragon', emo:'🐲'}, p2:{name:'Unicorn', emo:'🦄'}, p3:{name:'Dino', emo:'🦖'}};
const PET_IMG = true;  // true khi đã có hình img/pet/<p1|p2|p3>-<0..3>.webp (0 trứng, 1 trứng nứt, 2 thú con, 3 thú lớn)
function petGet(){
  const p = Object.assign({egg:null, name:'', food:0, day:'', today:0, fedDays:0, lastFed:'', plays:{}, startedAt:null, hatchedAt:null, sent:false}, lsGet(PET_KEY) || {});
  if (!p.plays || typeof p.plays !== 'object') p.plays = {};
  if (p.day !== today()){ p.day = today(); p.today = 0; }
  return p;
}
const petStage = p => p.food >= GROW ? 3 : p.food >= HATCH ? 2 : p.food >= CRACK ? 1 : 0;
const petKind = p => PETS[p.egg] || PETS.p1;
const petLabel = p => p.name || (petStage(p) >= 2 ? 'your ' + petKind(p).name.toLowerCase() : 'your egg');
const petPic = (egg, st) => PET_IMG ? `<img src="img/pet/${egg || 'p1'}-${st}.webp" alt="">`
  : `<span class="pemo s${st}">${st >= 2 ? (PETS[egg] || PETS.p1).emo : st === 1 ? '🐣' : '🥚'}</span>`;
const daysSince = d => d ? Math.round((new Date(today()) - new Date(d)) / 864e5) : 99;
// cho thú cưng ăn sau mỗi lượt chơi: số sao (0–3) = số 🍎, mỗi ngày tối đa FOOD_DAY
function feedPet(gid, score, total){
  const p = petGet(), t = today(), pct = total ? score / total : 0;
  const st = pct >= .9 ? 3 : pct >= .7 ? 2 : pct >= .4 ? 1 : 0;
  const gain = Math.max(0, Math.min(st, FOOD_DAY - p.today)), before = p.food;
  p.plays[gid] = (p.plays[gid] || 0) + 1;
  if (!p.startedAt) p.startedAt = new Date().toISOString();
  if (gain){ if (p.lastFed !== t){ p.fedDays++; p.lastFed = t; } p.today += gain; p.food += gain; }
  const hatched = before < HATCH && p.food >= HATCH, grew = before < GROW && p.food >= GROW;
  if (hatched){ if (!p.egg) p.egg = 'p1'; p.hatchedAt = new Date().toISOString(); p.sent = false; }
  lsSet(PET_KEY, p);
  return {st, gain, full:st > gain, hatched, grew, p};
}

const GKEY = 'a1kid-games';
const TTS = 'speechSynthesis' in window;
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const spellable = k => /^[a-z]{3,9}$/.test(VOCAB[k] ? VOCAB[k].w : '');
const GAMES = [
  {id:'listen', icon:'👂', name:'Listen & Tap', vi:'Nghe từ, chạm đúng hình', ok:d => d.pool.filter(hasPic).length >= 4, run:() => startListen()},
  {id:'spell', icon:'🔤', name:'Spelling Bee', vi:'Nghe từ, xếp chữ cái thành từ', ok:d => d.pool.filter(spellable).length >= 3, run:() => startSpell()},

function gamesHtml(d){

      return `<button class="gm" type="button" data-g="${x.id}"${x.ok(d) ? '' : ' disabled'}><span class="gi">${x.icon}</span><span><b>${x.name}</b><small>${x.vi}</small>${best ? `<small class="gbest">${best}</small>` : ''}</span></button>`;

// khung chung của các trò: tiêu đề, số câu đúng, thanh tiến độ, nút đóng
function gameShell(title){
  const ov = document.createElement('div'); ov.className = 'fxov game';
  ov.innerHTML = `<div class="gcard"><div class="ghead"><b>${title}</b><span class="gsc" id="gSc">0</span><button class="gx" type="button" aria-label="Close">✕</button></div>
    <div class="gtime"><i id="gT" style="width:0"></i></div><div id="gBody"></div></div>`;
  document.body.appendChild(ov);
  const G = {ov, body:$('#gBody', ov), score:0, over:false, done:false, timers:[], timer:null, hatched:false};
  G.later = (fn, ms) => G.timers.push(setTimeout(() => { if (!G.over) fn(); }, ms));
  G.setScore = n => { G.score = n; $('#gSc', ov).textContent = n; };
  G.prog = (i, n) => { $('#gT', ov).style.width = Math.round(i / n * 100) + '%'; };
  const onKey = ev => { if (ev.key === 'Escape') G.close(); };
  G.close = () => {
    if (G.over) return; G.over = true;
    G.timers.forEach(clearTimeout); clearInterval(G.timer); ov.remove(); document.removeEventListener('keydown', onKey);
    try { speechSynthesis.cancel(); } catch (e) {}
    if (!$('#home').hidden) renderHome();
    if (G.hatched) showHatch();
  };
  document.addEventListener('keydown', onKey);
  $('.gx', ov).onclick = () => G.close();
  return G;
}
// màn kết thúc chung: sao, thức ăn cho thú cưng, chơi lại
function gameEnd(G, gid, total, again){
  if (G.done || G.over) return; G.done = true;
  G.timers.forEach(clearTimeout); clearInterval(G.timer);
  const score = G.score, pct = total ? score / total : 0, r = feedPet(gid, score, total);
  if (gid !== 'review'){ const g = lsGet(GKEY) || {}, x = g[gid] || {plays:0, best:0}; x.plays++; x.best = Math.max(x.best || 0, Math.round(pct * 100)); g[gid] = x; lsSet(GKEY, g); }
  G.hatched = r.hatched;
  const food = r.gain ? `<span class="gfood">🍎 +${r.gain} for ${esc(petLabel(r.p))}!</span>`
    : r.st ? `<span class="gfood full">😋 Your pet is full today (${FOOD_DAY} 🍎). Come back tomorrow!<br><small>Hôm nay đủ ${FOOD_DAY} 🍎 rồi, mai cho ăn tiếp nha. Em vẫn chơi được để nhớ bài!</small></span>`
    : '<span class="gfood full">Win ⭐ to feed your pet! Try again 💪</span>';
  G.body.innerHTML = `<div class="gend"><img class="gmas" src="img/ui/mascot-${r.st >= 2 ? 2 : 3}.webp" alt=""><div class="gbig">${score} / ${total}</div>
    <div class="gst">${[1, 2, 3].map(i => `<span class="${i <= r.st ? '' : 'off'}">⭐</span>`).join('')}</div>
    <p>${score === total ? 'Amazing! All correct! 🏆' : pct >= .7 ? 'Great job! Keep it up! 💪' : 'Good try! Play again to remember more. 🌱'}</p>
    <p>${food}</p>
    ${r.hatched ? '<p style="font-weight:900;font-size:20px;color:#d0631a">🥚💥 Something is happening to your egg…!</p>' : r.grew ? '<p style="font-weight:900;color:#2c7a3f">🎉 Your pet grew big and strong!</p>' : ''}
    <div class="gbtns">${r.hatched ? '<button class="btn orange" type="button" id="gSee">See my egg! 🥚</button>'
      : '<button class="btn" type="button" id="gAgain">Play again 🔁</button><button class="btn lite" type="button" id="gClose">Close</button>'}</div></div>`;
  if (r.st === 3 || r.hatched){ confetti(); sfx('win'); } else sfx('ok');
  const a = $('#gAgain', G.body); if (a) a.onclick = () => { G.close(); again(); };
  const c = $('#gClose', G.body) || $('#gSee', G.body); c.onclick = () => G.close();
}

/* Quick review: từ ↔ nghĩa, 10 từ / 90 giây */
const viShort = v => (v.vi.replace(/\s*\([^)]*\)/g, '').trim() || v.vi);
function startReview(){
  const d = gameData(); if (d.pool.length < 4) return;
  const keys = shuffle(d.pool).slice(0, 10);
  const others = shuffle(Object.keys(VOCAB).filter(k => !keys.includes(k)));
  const Q = keys.map((k, i) => {
    const mode = i % 2 ? 'vi' : 'en';
    const wrong = shuffle(d.pool.filter(x => x !== k)).concat(others).filter(x => viShort(VOCAB[x]) !== viShort(VOCAB[k]) && VOCAB[x].w !== VOCAB[k].w);
    return {k, mode, opts:shuffle([k].concat(wrong.slice(0, 3)))};
  });
  const G = gameShell('⚡ Quick review'), body = G.body;
  let i = 0, lock = false, left = REV_SECS;
  $('#gT', G.ov).style.width = '100%';
  function show(){
    const q = Q[i], v = VOCAB[q.k];
    body.innerHTML = `<div class="gno">${i + 1} / ${Q.length}</div>
      ${q.mode === 'en' ? `<div class="gq"><button class="gsay" type="button" aria-label="Listen">🔊</button> ${esc(v.w)}</div><div class="gh">What does it mean?</div>`
        : `<div class="gq vi">${esc(viShort(v))}</div><div class="gh">Which English word?</div>`}
      <div class="gopts">${q.opts.map(o => `<button class="gopt" type="button" data-k="${esc(o)}">${esc(q.mode === 'en' ? viShort(VOCAB[o]) : VOCAB[o].w)}</button>`).join('')}</div>`;
    if (q.mode === 'en') say(v.w);
    const s = $('.gsay', body); if (s) s.onclick = () => say(v.w);
    lock = false;
  }
  body.addEventListener('click', ev => {
    const b = ev.target.closest('.gopt'); if (!b || lock || G.done) return;
    lock = true;
    const q = Q[i], right = b.dataset.k === q.k;
    $$('.gopt', body).forEach(x => { if (x.dataset.k === q.k) x.classList.add('ok'); });
    if (right){ G.setScore(G.score + 1); sfx('ok'); } else { b.classList.add('bad'); sfx('bad'); }
    if (q.mode === 'vi') say(VOCAB[q.k].w);
    G.later(() => { i++; i < Q.length ? show() : end(); }, right ? 800 : 1600);
  });
  function end(){
    if (G.done) return;
    const r = Object.assign({plays:0, best:0, stars:0}, lsGet(REV_KEY) || {});
    r.plays++; r.best = Math.max(r.best, Q.length >= 10 ? G.score : 0); delete r.days; lsSet(REV_KEY, r);
    gameEnd(G, 'review', Q.length, startReview);
  }
  const bar = $('#gT', G.ov);
  G.timer = setInterval(() => {
    left -= .25; bar.style.width = Math.max(0, left / REV_SECS * 100) + '%';
    bar.classList.toggle('low', left <= 15);
    if (left <= 0){ lock = true; end(); }
  }, 250);
  show();
}

/* Spelling Bee: nghe từ, xếp chữ cái */
function startSpell(){
  const pool = gameData().pool.filter(spellable); if (pool.length < 3) return;
  const Q = shuffle(pool).slice(0, 6);
  const G = gameShell('🔤 Spelling Bee'), body = G.body;
  let i = 0, miss = 0, lock = false, fill = [];
  const next = () => { i++; i < Q.length ? show() : gameEnd(G, 'spell', Q.length, startSpell); };
  const tileC = t => $(`.tile[data-t="${t}"]`, body);
  function show(){
    const w = VOCAB[Q[i]].w; G.prog(i, Q.length); miss = 0; lock = false; fill = Array(w.length).fill(null);
    let letters; do { letters = shuffle(w.split('')); } while (letters.join('') === w && new Set(w).size > 1);
    body.innerHTML = `<div class="gno">${i + 1} / ${Q.length}</div>
      ${wpic(Q[i], 'gpic')}
      <button class="bigsay" type="button" id="gSay">🔊 Listen</button>
      <div class="slots" id="gSl">${fill.map((_, j) => `<button class="slot" type="button" data-j="${j}"></button>`).join('')}</div>
      <div class="tiles">${letters.map((c, j) => `<button class="tile" type="button" data-t="${j}" data-c="${c}">${c}</button>`).join('')}</div>
      <div class="ghint" id="gHint"></div>`;
    $('#gSay', body).onclick = () => say(w);
    G.later(() => say(w), 350);
  }
  function paint(){ $$('.slot', body).forEach((s, j) => { s.textContent = fill[j] === null ? '' : tileC(fill[j]).dataset.c; s.classList.toggle('f', fill[j] !== null); }); }
  body.addEventListener('click', ev => {
    if (lock || G.done) return;
    const t = ev.target.closest('.tile'), s = ev.target.closest('.slot');
    if (t && !t.classList.contains('gone')){
      const j = fill.indexOf(null); if (j < 0) return;
      fill[j] = t.dataset.t; t.classList.add('gone'); sfx('tick'); paint();
      if (!fill.includes(null)) check();
    } else if (s && fill[+s.dataset.j] !== null){
      tileC(fill[+s.dataset.j]).classList.remove('gone'); fill[+s.dataset.j] = null; paint();
    }
  });
  function check(){
    const w = VOCAB[Q[i]].w, got = fill.map(t => tileC(t).dataset.c).join(''), sl = $('#gSl', body);
    lock = true;
    if (got === w){
      sl.classList.add('ok'); sfx('ok'); say(w);
      if (!miss) G.setScore(G.score + 1);
      G.later(next, 1400); return;
    }
    miss++; sfx('bad'); sl.classList.remove('bad'); void sl.offsetWidth; sl.classList.add('bad');
    if (miss >= 3){ $('#gHint', body).textContent = '👉 ' + w; say(w); G.later(next, 2400); return; }
    G.later(() => { // trả lại các chữ sai chỗ, giữ chữ đúng
      fill.forEach((t, j) => { if (tileC(t).dataset.c !== w[j]){ tileC(t).classList.remove('gone'); fill[j] = null; } });
      paint(); sl.classList.remove('bad'); lock = false;
      $('#gHint', body).textContent = miss === 1 ? 'Almost! Try again 💪' : 'Listen again 🔊 and try!';
      if (miss === 2) say(w);
    }, 650);
  }
  show();
}

/* Sentence Lab: xếp câu (nghe rồi xếp thẻ từ) xen kẽ chọn từ đúng điền vào câu */
function startGram(){
  const d = gameData(); if (d.gram.length < 4) return;
  const Q = shuffle(d.gram).slice(0, 8).map((g, j) => {
    const words = g.s.replace(/[.?!]$/, '').split(' ');
    return Object.assign({}, g, {words, end:(g.s.match(/[.?!]$/) || [''])[0], mode:j % 2 === 0 && words.length <= 8 ? 'build' : 'choose'});
  });
  const G = gameShell('🧩 Sentence Lab'), body = G.body;
  let i = 0, miss = 0, lock = false, picked = [];
  const next = () => { i++; i < Q.length ? show() : gameEnd(G, 'gram', Q.length, startGram); };
  const head = () => `<div class="gno">${i + 1} / ${Q.length}</div>`;
  function show(){
    const q = Q[i]; G.prog(i, Q.length); miss = 0; lock = false; picked = [];
    if (q.mode === 'build'){
      let order; do { order = shuffle(q.words.map((_, j) => j)); } while (order.every((v, j) => q.words[v] === q.words[j]) && q.words.length > 1);
      body.innerHTML = `${head()}<button class="bigsay" type="button" id="gSay">🔊 Listen</button>
        <div class="gh">Listen and put the words in order.</div>
        <div class="sline" id="gLine"></div>
        <div class="tiles">${order.map(j => `<button class="tile w" type="button" data-t="${j}">${esc(q.words[j])}</button>`).join('')}</div>
        <div class="ghint" id="gHint"></div>`;
      paintLine();
      $('#gSay', body).onclick = () => say(q.s);
      G.later(() => say(q.s), 350);
    } else {
      const blank = q.s.replace(new RegExp('(^|[^\\w’\'])' + reEsc(q.g) + '(?![\\w’\'])'), '$1\u0000');
      body.innerHTML = `${head()}<div class="gh">Choose the right word.</div>
        <div class="gsent">${esc(blank).replace('\u0000', '<u>&nbsp;?&nbsp;</u>')}</div>
        <div class="gopts" style="grid-template-columns:repeat(auto-fit,minmax(110px,1fr))">${shuffle([q.g].concat(q.x)).map(o => `<button class="gopt" type="button" data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div>
        <div class="ghint" id="gHint"></div>`;
    }
  }
  function paintLine(){
    const q = Q[i];
    $('#gLine', body).innerHTML = picked.map(j => `<button class="tile w" type="button" data-t="${j}">${esc(q.words[j])}</button>`).join('') + `<span class="dot">${q.end}</span>`;
  }
  body.addEventListener('click', ev => {
    if (lock || G.done) return;
    const q = Q[i];
    if (q.mode === 'build'){
      const t = ev.target.closest('.tiles .tile'), p = ev.target.closest('.sline .tile');
      if (t && !t.classList.contains('gone')){
        picked.push(+t.dataset.t); t.classList.add('gone'); sfx('tick'); paintLine();
        if (picked.length === q.words.length) checkBuild();
      } else if (p){
        const j = +p.dataset.t; picked = picked.filter(x => x !== j);
        $(`.tiles .tile[data-t="${j}"]`, body).classList.remove('gone'); paintLine();
      }
      return;
    }
    const b = ev.target.closest('.gopt'); if (!b) return;
    lock = true;
    const right = b.dataset.o === q.g;
    $$('.gopt', body).forEach(x => { if (x.dataset.o === q.g) x.classList.add('ok'); });
    $('.gsent u', body).textContent = q.g;
    if (right){ G.setScore(G.score + 1); sfx('ok'); } else { b.classList.add('bad'); sfx('bad'); $('#gHint', body).textContent = '👉 ' + q.s; }
    G.later(() => say(q.s), 300);
    G.later(next, right ? 1900 : 3000);
  });
  function checkBuild(){
    const q = Q[i], line = $('#gLine', body);
    lock = true;
    if (picked.every((j, n) => q.words[j] === q.words[n])){
      line.classList.add('ok'); sfx('ok'); say(q.s);
      if (!miss) G.setScore(G.score + 1);
      G.later(next, 1900); return;
    }
    miss++; sfx('bad'); line.classList.remove('bad'); void line.offsetWidth; line.classList.add('bad');
    if (miss >= 3){ $('#gHint', body).textContent = '👉 ' + q.s; say(q.s); G.later(next, 3400); return; }
    G.later(() => { // giữ các từ đầu đã đúng, trả lại phần sau
      let k = 0; while (k < picked.length && q.words[picked[k]] === q.words[k]) k++;
      picked.slice(k).forEach(j => $(`.tiles .tile[data-t="${j}"]`, body).classList.remove('gone'));
      picked = picked.slice(0, k); paintLine(); lock = false;
      $('#gHint', body).textContent = k ? `Almost! The first ${k > 1 ? k + ' words are' : 'word is'} right 👍 Try again!` : 'Listen again 🔊 and try!';
      if (miss === 2) say(q.s);
    }, 700);
  }
  show();
}

        <div class="stat"><b>🏁 ${d.done}</b><span>weeks done</span></div>
      </div>
      <div class="lvl"><span class="lvn">🏆 Level ${lv}</span><div class="lvbar"><i style="width:${Math.round(xp / 6 * 100)}%"></i></div><span class="lvx">⭐ ${xp}/6</span></div>
      ${cur ? `<a class="btn orange hwgo" href="?w=${cur.w}">📒 Week ${cur.w} homework ▶</a>` : ''}
      <div class="hiedit"><button class="linkbtn" type="button" id="hiEdit">✏️ ${YA ? 'Change avatar' : 'Change name / avatar'}</button></div>
    </section>
    ${petHtml(d)}
    ${gamesHtml(d)}
    ${mapHtml(d)}
    ${badgesHtml(d)}`;
  $('#hiEdit').onclick = showStart;
  $$('#petCard [data-egg]').forEach(b => b.onclick = () => {
    const p = petGet(); p.egg = b.dataset.egg; lsSet(PET_KEY, p); sfx('badge'); confetti(60); renderHome();
    toast(`🥚 Your ${PETS[p.egg].name} egg! Play a game to feed it 🍎`);
  });
  $$('#games [data-g]').forEach(b => b.onclick = () => { sfx('tick'); GAMES.find(x => x.id === b.dataset.g).run(); });
  drawMap(); setTimeout(drawMap, 300); // vẽ lại khi font / ảnh tải xong
  $$('#map img').forEach(im => { if (!im.complete) im.addEventListener('load', drawMap, {once:true}); });
  yaHome();
}
function showHome(){
  setHero(false);
  ['start', 'work', 'bar'].forEach(id => $('#' + id).hidden = true);
  $('#home').hidden = false;
  renderHome();
  const p = petGet();
  if (p.hatchedAt && !p.name) setTimeout(showHatch, 600); // trứng đã nở mà em chưa đặt tên
  else { sendPet(); setTimeout(checkBadges, 700); }
}

/* ============ ĐẾM SỐ LẦN RỜI TRANG ============ */
// Đếm riêng cho lần 1 (leaves) và lúc làm lại câu sai (leaves2)
let away = false, muteAway = false;
function releaseAway(){ setTimeout(() => { muteAway = false; away = false; }, 800); }
const tracking = () => !!S.startedAt && !S.done && (!S.submitted || !!S.retrying) && !$('#work').hidden;
function goAway(){
  if (muteAway || away || !tracking()) return;
  away = true;
  if (S.submitted) S.leaves2 = (S.leaves2 || 0) + 1; else S.leaves = (S.leaves || 0) + 1;
  save();
}
function comeBack(){
  if (document.hidden || !document.hasFocus()) return;
  const was = away; away = false;
  const n = S.submitted ? S.leaves2 : S.leaves;
  if (was && tracking() && (n || 0) > 5) toast(tease('away'));
}
document.addEventListener('visibilitychange', () => document.hidden ? goAway() : comeBack());
window.addEventListener('blur', goAway);
window.addEventListener('focus', comeBack);

/* ============ KHỞI ĐỘNG ============ */
paintSnd();
function boot(){
  if (YA && !YA.me()){ YA.require(YA_OPTS).then(() => { yaSync(); boot(); }); return; } // bắt đăng nhập trước
  yaSync();
  if (!ME.name || !avGet()) showStart();
  else if (IN_LESSON) showWork();
  else showHome();
  if (S.submitted && WEEK && (!S.sent || (S.submittedAt2 && !S.sent2))) send(); // lần trước gửi chưa xong → gửi tiếp
}
boot();
</script>
